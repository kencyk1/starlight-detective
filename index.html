  if (st.borrows >= 5) earnBadge('borrow_boss');
  if (st.arrays >= 5) earnBadge('array_architect');
  if (st.deals >= 5) earnBadge('fair_sharer');
  if (st.casesClosed >= 1) earnBadge('case_closer');
  if (st.casesClosed >= 3) earnBadge('triple');
  if (st.purchases >= 3) earnBadge('shopper');
  if (S.cases.every(c => c.status === 'closed')) earnBadge('all_cases');
  if ((st.eqFirst || 0) >= 10) earnBadge('equation_ace');
  if (st.labSolved >= 20) earnBadge('lab_20');
  if ((st.twoStep || 0) >= 10) earnBadge('double_lock');
  if (S.speed.best >= 10) earnBadge('speed_10');
  if (S.speed.best >= 20) earnBadge('speed_20');
  if (S.daily.best >= 3) earnBadge('daily_3');
  if (S.daily.best >= 7) earnBadge('daily_7');
  if (ownedCount() >= 40) earnBadge('collector');
}

/* avatar: the player's drawn detective (see character.js) */
function avatarHTML(size = 64, opts = {}) { return characterSVG({ ...opts, size }); }

/* the player's sidekick pet, shown beside the detective */
function sidekickHTML(cls = '') {
  const p = SHOP.pets.find(x => x.id === S.equipped.pet);
  return p && p.e ? `<span class="sidekick ${cls}" title="${esc(p.name)}" aria-hidden="true">${p.e}</span>` : '';
}

/* ============================================================
   The safe (cipher). Column wheels for + and −, free wheels for × and ÷,
   with sharing trays (÷) and a crate builder (×).
   ============================================================ */
const PLACE_NAMES = ['ones', 'tens', 'hundreds', 'thousands', 'ten-thousands'];
let CURRENT_CIPHER = null;

function tokenHTML(unit, emoji) {
  if (unit === 10) return '<span class="tk pack">10</span>';
  if (unit === 100) return '<span class="tk bag">100</span>';
  return `<span class="tk">${emoji}</span>`;
}

function createCipher(root, p, opts) {
  const lab = !!opts.lab;
  const rng = makeRng('cipher', opts.seedKey || '', p.ans, Date.now());
  const st = { misses: 0, maxHint: 0, capped: false, solved: false, coach: null, hint: null, hintLevel: 0, entry: '', freeMisses: 0, choices: null, stars: 0 };
  const W = p.wheels;
  const cols = [];
  if (p.mode === 'column') {
    const la = String(p.a).length, lb = String(p.b).length;
    for (let j = 0; j < W; j++) {
      const place = W - 1 - j;
      cols.push({ place, topBlank: place >= la, botBlank: place >= lb, orig: digitAt(p.a, place), top: digitAt(p.a, place), bot: digitAt(p.b, place),
        lent: false, received: false, gear: false, val: null, done: false, misses: 0, hint: 0, lastWrong: null, choices: null });
    }
  }
  let active = W - 1;
  let undo = [];
  const model = p.op === 'div'
    ? { pile: p.d * p.qq, trays: Array(p.d).fill(0), fair: false, msg: '' }
    : p.op === 'mul' ? { crates: 0, per: 0, counted: new Set(), matched: false, msg: '' } : null;
  const tokenE = opts.tokenEmoji || '⭐';

  function coach(kind, msg) { st.coach = { kind, msg }; }

  /* ---------- rendering ---------- */
  function wheelHTML(val, cls) { return `<div class="wheel ${cls}"><span>${val ?? ''}</span></div>`; }

  function columnHTML() {
    const sign = OP_SYMBOL[p.op];
    let gears = '<div class="cg-cell"></div>', tops = '<div class="cg-cell"></div>', bots = `<div class="cg-cell cg-sign">${sign}</div>`, ans = '<div class="cg-cell"></div>';
    cols.forEach((c, j) => {
      // gear row (addition)
      if (p.op === 'add') {
        if (!st.solved && j === active - 1) gears += `<div class="cg-cell"><button type="button" class="gear-slot ${c.gear ? 'on' : ''}" data-c="gear" aria-pressed="${c.gear}" aria-label="Carry gear above the ${PLACE_NAMES[c.place]} column">${c.gear ? '⚙️' : '<span class="gear-ghost">⚙</span>'}</button></div>`;
        else gears += `<div class="cg-cell">${c.gear ? '<span class="gear-fixed">⚙️</span>' : ''}</div>`;
      }
      // top row
      const changed = c.lent || c.received;
      const topInner = c.topBlank ? '' : changed ? `<span class="was">${c.orig}</span><span class="now">${c.top}</span>` : `${c.top}`;
      const canLend = p.op === 'sub' && !st.solved && j < active && !c.topBlank;
      tops += canLend
        ? `<div class="cg-cell"><button type="button" class="digit lendable ${changed ? 'changed' : ''}" data-c="lend" data-j="${j}" aria-label="Borrow from the ${PLACE_NAMES[c.place]} column (${c.top})">${topInner}</button></div>`
        : `<div class="cg-cell"><span class="digit ${changed ? 'changed' : ''}">${topInner}</span></div>`;
      bots += `<div class="cg-cell"><span class="digit">${c.botBlank ? '' : c.bot}</span></div>`;
      const cls = c.done ? 'done' : (j === active && !st.solved ? 'active' : 'idle');
      ans += `<div class="cg-cell">${wheelHTML(c.val, cls)}</div>`;
    });
    const rows = (p.op === 'add' ? `<div class="cg-row gears">${gears}</div>` : '') +
      `<div class="cg-row">${tops}</div><div class="cg-row">${bots}</div><div class="cg-rule"></div><div class="cg-row">${ans}</div>`;
    return `<div class="colgrid" style="--n:${W + 1}">${rows}</div>`;
  }

  function freeHTML() {
    const digits = st.entry.split('');
    const pad = W - digits.length;
    let wheels = '';
    for (let i = 0; i < W; i++) wheels += wheelHTML(i < pad ? '' : digits[i - pad], st.solved ? 'done' : (i === W - 1 && !st.entry ? 'active' : (i >= pad ? 'filled' : 'idle')));
    return `<div class="free-eq">${equationText(p)} = ?</div><div class="free-wheels">${wheels}</div>`;
  }

  function keypadHTML() {
    if (st.solved) return '';
    let keys = '';
    for (const v of [1, 2, 3, 4, 5, 6, 7, 8, 9, 0]) keys += `<button type="button" class="key" data-c="d" data-v="${v}">${v}</button>`;
    const isCol = p.mode === 'column';
    const extra = isCol
      ? (p.op === 'sub' ? `<button type="button" class="key wide ghost" data-c="undo" ${undo.length ? '' : 'disabled'}>Undo ↩</button>` : '')
      : `<button type="button" class="key wide ghost" data-c="back" aria-label="Delete last digit">⌫</button>`;
    const go = isCol ? `Try it 🔓` : `Open the safe 🔓`;
    return `<div class="keypad">${keys}</div><div class="key-actions">${extra}<button type="button" class="btn go" data-c="try">${go}</button></div>`;
  }

  function choicesHTML() {
    let list = null;
    if (p.mode === 'column') { const c = cols[active]; if (c && c.misses >= 2) { if (!c.choices) c.choices = digitChoices(expectedDigit(active), c.lastWrong, rng); list = c.choices; } }
    else if (st.freeMisses >= 2) { if (!st.choices) st.choices = freeChoices(p, rng); list = st.choices; }
    if (!list || st.solved) return '';
    return `<div class="choices"><span class="choices-label">🦊 Pick one:</span>${list.map(v => `<button type="button" class="chip" data-c="pick" data-v="${v}">${fmt(v)}</button>`).join('')}</div>`;
  }

  function hintBtnHTML() {
    if (st.solved) return '';
    const lvl = p.mode === 'column' ? (cols[active] ? cols[active].hint : 0) : st.hintLevel;
    const cost = lab ? '' : ' · 1 🔎';
    const label = lvl === 0 ? '💡 Hint' : lvl === 1 ? `💡 More help${cost}` : lvl === 2 ? `💡 Show me how${cost}` : '💡 No more hints';
    return `<button type="button" class="btn hint" data-c="hint" ${lvl >= 3 ? 'disabled' : ''}>${label}</button>`;
  }

  function coachHTML() {
    if (!st.coach) return `<div class="coach idle"><span class="coach-e">🦊</span><span>${p.mode === 'column'
      ? `Start with the <b>${PLACE_NAMES[cols[active].place]}</b> wheel on the right. Tap a number, then <b>Try it</b>.`
      : `Tap the numbers to spin the wheels, then <b>Open the safe</b>.`}</span></div>`;
    const e = st.coach.kind === 'ok' ? '✅' : st.coach.kind === 'miss' ? '🦊' : '🦊';
    return `<div class="coach ${st.coach.kind}" aria-live="polite"><span class="coach-e">${e}</span><span>${st.coach.msg}</span>${sayBtn(st.coach.msg.replace(/<[^>]+>/g, ''), FELIX.voice, 'Read Felix\'s tip')}</div>`;
  }

  function hintPanelHTML() {
    if (!st.hint || st.solved) return '';
    return `<div class="hint-panel"><div class="hint-title">💡 ${st.hint.title}</div>${st.hint.html}${sayBtn(st.hint.say, FELIX.voice, 'Read the hint')}</div>`;
  }

  function modelHTML() {
    if (!model) return '';
    if (p.op === 'div') {
      const pile = Array.from({ length: model.pile }, () => tokenHTML(p.unit, tokenE)).join('');
      const trays = model.trays.map((n, i) => `<button type="button" class="tray" data-c="tray" data-i="${i}" aria-label="Tray ${i + 1}">${Array.from({ length: n }, () => tokenHTML(p.unit, tokenE)).join('')}</button>`).join('');
      return `<div class="model"><div class="model-head"><b>🧺 Sharing trays</b><span>Tap a tray to drop one in, or deal a whole round.</span></div>
        <div class="pile ${model.pile ? '' : 'empty'}">${pile || '<span class="muted">Pile is empty</span>'}</div>
        <div class="tray-row">${trays}</div>
        <div class="model-actions"><button type="button" class="btn small" data-c="deal" ${model.pile >= p.d ? '' : 'disabled'}>Deal a round 🃏</button><button type="button" class="btn small ghost" data-c="resetTrays">Start over ↺</button></div>
        ${model.msg ? `<div class="model-msg ${model.fair ? 'good' : ''}">${model.msg}</div>` : ''}</div>`;
    }
    const crates = Array.from({ length: model.crates }, (_, i) => {
      const counted = model.counted.has(i);
      return `<button type="button" class="crate ${counted ? 'counted' : ''}" data-c="crate" data-i="${i}" aria-label="Crate ${i + 1}${counted ? ', counted' : ''}">${counted ? '<span class="crate-check">✓</span>' : ''}${Array.from({ length: model.per }, () => tokenHTML(p.unit, tokenE)).join('')}</button>`;
    }).join('');
    return `<div class="model"><div class="model-head"><b>📦 Crate builder</b><span>Build the clue, then tap each crate as you count it.</span></div>
      <div class="steppers">
        <div class="stepper"><span>Crates</span><button type="button" class="step" data-c="crates" data-v="-1" aria-label="Fewer crates">−</button><b>${model.crates}</b><button type="button" class="step" data-c="crates" data-v="1" aria-label="More crates">+</button></div>
        <div class="stepper"><span>In each</span><button type="button" class="step" data-c="per" data-v="-1" aria-label="Fewer in each crate">−</button><b>${model.per}</b><button type="button" class="step" data-c="per" data-v="1" aria-label="More in each crate">+</button></div>
      </div>
      <div class="crate-row">${crates || '<span class="muted">Add some crates!</span>'}</div>
      ${p.unit > 1 ? `<div class="muted small-note">Each ${tokenHTML(p.unit)} is ${p.unit === 10 ? 'a pack of 10' : 'a bag of 100'}.</div>` : ''}
      ${model.msg ? `<div class="model-msg ${model.matched ? 'good' : ''}">${model.msg}</div>` : ''}</div>`;
  }

  function render() {
    if (!root.isConnected) return;
    if (st.solved) {
      root.innerHTML = `<div class="safe open ${opts.partial ? 'partial' : ''}"><div class="door" aria-hidden="true"></div>
        <div class="safe-inside"><div class="stamp cracked">${opts.partial ? esc(opts.partial) : 'CRACKED!'}</div>
        <div class="cracked-ans">${equationText(p)} = <b>${fmt(p.ans)}</b></div>
        ${opts.partial ? '<div class="lock-next">🔐 One more lock to go!</div>' : `<div class="stars-pop">+${st.stars} ⭐</div>`}</div></div>`;
      return;
    }
    const opName = OP_NAME[p.op];
    root.innerHTML = `<div class="safe">
      <div class="safe-plate"><span class="safe-label">${opts.lockLabel ? esc(opts.lockLabel) + ' · ' : 'SAFE · '}${opName.toUpperCase()} ${OP_SYMBOL[p.op]}</span><span class="safe-lock" aria-hidden="true">${opts.lockLabel ? '🔐' : '🔒'}</span></div>
      <div class="safe-face">${p.mode === 'column' ? columnHTML() : freeHTML()}</div>
      ${coachHTML()}${choicesHTML()}${keypadHTML()}
      <div class="safe-tools">${hintBtnHTML()}${!lab && S.tokens < 1 ? '<span class="muted tiny">No 🔎 tokens. Find bonus clues to earn more!</span>' : ''}</div>
      ${hintPanelHTML()}
    </div>${modelHTML()}`;
  }

  /* ---------- logic ---------- */
  function colVals(j) {
    const c = cols[j];
    return { t: c.topBlank ? 0 : c.top, b: c.botBlank ? 0 : c.bot };
  }
  function expectedDigit(j) {
    const c = cols[j], { t, b } = colVals(j);
    if (p.op === 'add') return (t + b + (c.gear ? 1 : 0)) % 10;
    // subtraction: the true digit of the answer at this place
    return digitAt(p.ans, c.place);
  }

  function tryColumn() {
    const c = cols[active];
    if (c.val == null) { coach('remind', `Tap a number for the <b>${PLACE_NAMES[c.place]}</b> wheel first.`); return render(); }
    const { t, b } = colVals(active);
    let r;
    if (p.op === 'add') r = checkAddColumn({ t, b, cin: c.gear ? 1 : 0, given: c.val, gearPlaced: active > 0 ? cols[active - 1].gear : false });
    else r = checkSubColumn({ T: t, B: b, received: c.received, given: c.val });
    if (r.status === 'ok') {
      c.done = true; undo = []; SFX.tumbler(); setTimeout(SFX.chime, 90);
      if (p.op === 'add' && r.carried) S.stats.carries++;
      if (p.op === 'sub' && r.borrowed) S.stats.borrows++;
      st.hint = null;
      active--;
      if (active < 0) return solve();
      coach('ok', `Click! The <b>${PLACE_NAMES[c.place]}</b> wheel is unlocked. Now the <b>${PLACE_NAMES[cols[active].place]}</b>.`);
    } else if (r.status === 'remind') {
      coach('remind', r.msg);
    } else {
      st.misses++; c.misses++; c.lastWrong = c.val; SFX.boop(); coach('miss', r.msg);
    }
    render();
  }

  function tryFree() {
    if (!st.entry) { coach('remind', 'Spin the wheels first: tap the numbers on the keypad.'); return render(); }
    const given = Number(st.entry);
    const r = p.op === 'mul' ? checkMul(p, given) : checkDiv(p, given);
    if (r.status === 'ok') return solve();
    st.misses++; st.freeMisses++; SFX.boop(); coach('miss', r.msg); render();
  }

  function solve() {
    st.solved = true; CURRENT_CIPHER = null;
    SFX.safeOpen();
    const res = { misses: st.misses, capped: st.capped, firstTry: st.misses === 0 && st.maxHint < 2 };
    st.stars = opts.onSolved ? opts.onSolved(res) : 0;
    render();
  }

  function lend(j) {
    if (j >= active) { coach('remind', 'Borrow from a column to the <b>left</b> of the one you\'re working on.'); return render(); }
    const c = cols[j], r = cols[j + 1];
    if (j + 1 !== active && !(r.top === 0 && !r.received)) { coach('remind', `Borrow from the column right next to the <b>${PLACE_NAMES[cols[active].place]}</b>.`); return render(); }
    if (c.lent) { coach('remind', 'That column already lent 1. Each column can only lend once.'); return render(); }
    if (r.received) { coach('remind', 'That column already borrowed once. Try the wheel now!'); return render(); }
    if (c.top === 0) { coach('remind', 'This column has 0, so it has nothing to lend yet. Borrow for it first: tap the number to <b>its</b> left!'); return render(); }
    c.top -= 1; c.lent = true; r.top += 10; r.received = true; undo.push(j);
    SFX.click(); st.coach = null; render();
  }
  function undoLend() {
    const j = undo.pop(); if (j == null) return;
    const c = cols[j], r = cols[j + 1];
    c.top += 1; c.lent = false; r.top -= 10; r.received = false;
    SFX.click(); coach('remind', 'Borrow undone.'); render();
  }

  function hint() {
    const isCol = p.mode === 'column';
    const lvl = isCol ? cols[active].hint : st.hintLevel;
    if (lvl >= 3) return;
    const next = lvl + 1;
    if (next >= 2 && !lab) {
      if (S.tokens < 1) { coach('remind', 'You\'re out of clue tokens 🔎. Find hidden bonus clues with your flashlight to earn more. Keep trying: after two tries, I\'ll give you choices!'); return render(); }
      S.tokens--; refreshHud(); SFX.coin();
    }
    if (isCol) cols[active].hint = next; else st.hintLevel = next;
    st.maxHint = Math.max(st.maxHint, next);
    if (next === 3) st.capped = true;
    st.hint = buildHint(next);
    save(); render();
  }

  function blocks(n, cls) { return Array.from({ length: n }, () => `<i class="blk ${cls}"></i>`).join(''); }
  function buildHint(level) {
    if (p.op === 'add') {
      const c = cols[active], { t, b } = colVals(active), cin = c.gear ? 1 : 0, s = t + b + cin, col = PLACE_NAMES[c.place];
      if (level === 1) { const tx = `Work on the ${col} column. Add the top number, the bottom number${cin ? ', and the carry gear' : ''}. If you get 10 or more, write only the ones digit and put a carry gear on the next column.`; return { title: 'Strategy', html: `<p>${tx}</p>`, say: tx }; }
      if (level === 2) { const tx = `Count all the blocks together. If there are 10 or more, ten of them ride up to the next column as a carry gear.`;
        return { title: 'Blocks', html: `<div class="blocks"><span class="bgrp">${blocks(t, 'a')}</span><b>+</b><span class="bgrp">${blocks(b, 'b')}</span>${cin ? `<b>+</b><span class="bgrp">${blocks(1, 'g')}</span>` : ''}</div><p>${tx}</p>`, say: tx }; }
      const tx = `${t} + ${b}${cin ? ' + 1' : ''} = ${s}. Write ${s % 10} on the wheel${s >= 10 ? ', and put a carry gear on the next column' : ''}.`;
      return { title: 'Show me how', html: `<p>${tx}</p>`, say: tx };
    }
    if (p.op === 'sub') {
      const c = cols[active], { t: T, b: B } = colVals(active), col = PLACE_NAMES[c.place];
      if (level === 1) { const tx = `Look at the ${col} column. Is the top number big enough to take the bottom number away? If not, tap the top number to its left to borrow 1 ten.`; return { title: 'Strategy', html: `<p>${tx}</p>`, say: tx }; }
      if (level === 2) {
        if (T < B) { const tx = `There are only ${T} blocks, but we need to take away ${B}. Not enough! Borrow 10 more from the column on the left.`; return { title: 'Blocks', html: `<div class="blocks"><span class="bgrp">${blocks(T, 'a')}</span></div><p>${tx}</p>`, say: tx }; }
        const tx = `Start with ${T} blocks and cross out ${B}. Count what's left.`;
        return { title: 'Blocks', html: `<div class="blocks"><span class="bgrp">${blocks(T - B, 'a')}${blocks(B, 'x')}</span></div><p>${tx}</p>`, say: tx };
      }
      let tx;
      if (T < B) {
        const left = cols[active - 1];
        tx = left && left.top === 0 ? `First borrow: the column to the left is 0, so tap the number left of it first, then tap the 0 column. Then ${T + 10} − ${B} = ${T + 10 - B}.` : `First tap the top number to the left to borrow. Then ${T + 10} − ${B} = ${T + 10 - B}.`;
      } else tx = `${T} − ${B} = ${T - B}. Put ${T - B} on the wheel.`;
      return { title: 'Show me how', html: `<p>${tx}</p>`, say: tx };
    }
    if (p.op === 'mul') {
      const { a, b, k, unit } = p;
      if (level === 1) { const tx = unit > 1 ? `Use a fact you know: ${a} × ${k}. Each crate holds ${unit === 10 ? 'tens' : 'hundreds'}, so put the zero${unit === 100 ? 's' : ''} back on the end.` : `Multiplying means equal groups. Build ${a} crates with ${b} in each, then count them all.`; return { title: 'Strategy', html: `<p>${tx}</p>`, say: tx }; }
      if (level === 2) { model.crates = a; model.per = k; model.counted.clear(); modelCheck(); const tx = `I built the crates for you. Count by ${fmt(b)}s: tap each crate as you go.`; return { title: 'Crates built', html: `<p>${tx}</p>`, say: tx }; }
      const tx = unit > 1 ? `${a} × ${k} = ${a * k}. They are ${unit === 10 ? 'tens' : 'hundreds'}, so ${a * k} ${unit === 10 ? 'tens' : 'hundreds'} is ${fmt(p.ans)}.` : `${a} × ${b} = ${p.ans}.`;
      return { title: 'Show me how', html: `<p>${tx}</p>`, say: tx };
    }
    const { N, d, qq, unit } = p;
    if (level === 1) { const tx = `Sharing means equal groups. Deal the pile into ${d} trays, one round at a time, until it's all gone. Then count one tray.`; return { title: 'Strategy', html: `<p>${tx}</p>`, say: tx }; }
    if (level === 2) {
      model.trays = Array(d).fill(0); model.pile = d * qq; model.fair = false;
      const rounds = Math.max(1, Math.floor(qq / 2));
      for (let r = 0; r < rounds; r++) { model.trays = model.trays.map(n => n + 1); model.pile -= d; }
      model.msg = ''; const tx = `I dealt some rounds for you. Keep dealing until the pile is empty!`;
      return { title: 'Trays started', html: `<p>${tx}</p>`, say: tx };
    }
    const tx = unit > 1 ? `Think: ${d} × ? = ${fmt(N)}. ${d} × ${qq} = ${d * qq}, so ${d} × ${fmt(qq * unit)} = ${fmt(N)}. The answer is ${fmt(p.ans)}.` : `Think: ${d} × ? = ${N}. ${d} × ${qq} = ${N}, so the answer is ${qq}.`;
    return { title: 'Show me how', html: `<p>${tx}</p>`, say: tx };
  }

  function modelCheck() {
    if (p.op === 'mul') {
      const ok = model.crates === p.a && model.per === p.k;
      if (ok && !model.matched) { model.matched = true; S.stats.arrays++; checkStatBadges(); SFX.chime(); }
      if (!ok) model.matched = false;
      model.msg = ok ? (model.counted.size === p.a ? '✓ Matches the clue, and every crate is counted!' : '✓ That matches the clue! Now tap each crate as you count.') : '';
    } else {
      if (model.pile === 0) {
        const fair = model.trays.every(n => n === model.trays[0]);
        if (fair && !model.fair) { model.fair = true; S.stats.deals++; checkStatBadges(); SFX.chime(); }
        model.msg = fair ? '✓ Fair share! Every tray has the same. Count one tray.' : 'Hmm, not fair. Some trays have more than others. Tap Start over.';
      } else model.msg = '';
    }
  }

  function onClick(e) {
    const b = e.target.closest('[data-c]'); if (!b || !root.contains(b) || b.disabled || st.solved) return;
    handle(b.dataset.c, b.dataset.v != null ? Number(b.dataset.v) : null, b);
  }
  function handle(c, v, b) {
    if (c === 'd') {
      SFX.click();
      if (p.mode === 'column') { cols[active].val = v; }
      else { if (!(st.entry === '' && v === 0) && st.entry.length < W) st.entry += String(v); }
      return render();
    }
    if (c === 'back') { st.entry = st.entry.slice(0, -1); SFX.click(); return render(); }
    if (c === 'pick') { SFX.click(); if (p.mode === 'column') cols[active].val = v; else st.entry = String(v); return render(); }
    if (c === 'try') return p.mode === 'column' ? tryColumn() : tryFree();
    if (c === 'gear') { const g = cols[active - 1]; if (g) { g.gear = !g.gear; SFX.tumbler(); } return render(); }
    if (c === 'lend') return lend(Number(b.dataset.j));
    if (c === 'undo') return undoLend();
    if (c === 'hint') return hint();
    if (c === 'tray') { if (model.pile > 0) { model.pile--; model.trays[Number(b.dataset.i)]++; SFX.click(); modelCheck(); } return render(); }
    if (c === 'deal') { if (model.pile >= p.d) { model.trays = model.trays.map(n => n + 1); model.pile -= p.d; SFX.tumbler(); modelCheck(); } return render(); }
    if (c === 'resetTrays') { model.trays = Array(p.d).fill(0); model.pile = p.d * p.qq; model.fair = false; model.msg = ''; SFX.click(); return render(); }
    if (c === 'crates') { model.crates = Math.max(0, Math.min(9, model.crates + v)); model.counted.clear(); SFX.click(); modelCheck(); return render(); }
    if (c === 'per') { model.per = Math.max(0, Math.min(9, model.per + v)); model.counted.clear(); SFX.click(); modelCheck(); return render(); }
    if (c === 'crate') { const i = Number(b.dataset.i); model.counted.has(i) ? model.counted.delete(i) : model.counted.add(i); SFX.click(); modelCheck(); return render(); }
  }
  root.addEventListener('click', onClick);

  const api = {
    key(k) {
      if (st.solved) return false;
      if (/^[0-9]$/.test(k)) { handle('d', Number(k), null); return true; }
      if (k === 'Enter') { p.mode === 'column' ? tryColumn() : tryFree(); return true; }
      if (k === 'Backspace') { if (p.mode === 'column') { cols[active].val = null; render(); } else { st.entry = st.entry.slice(0, -1); render(); } return true; }
      return false;
    },
    get solved() { return st.solved; },
  };
  CURRENT_CIPHER = api;
  render();
  return api;
}

document.addEventListener('keydown', (e) => {
  if (!CURRENT_CIPHER || e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  if (!$('#modal-root').hidden) return;
  if (document.activeElement && document.activeElement.id === 'scanner') return;
  if (e.key === 'Enter' && document.activeElement && document.activeElement.tagName === 'BUTTON') return;
  if (CURRENT_CIPHER.key(e.key)) e.preventDefault();
});

/* ============================================================
   Step 1 before every safe: build the equation from the word problem.
   The kid places the two numbers and picks the sign; − and ÷ need the
   right order. Mistakes coach (and highlight clue words) but cost no stars.
   ============================================================ */
const CLUE_WORDS = {
  add: /\b(altogether|in all|more|total|together|add them)\b/gi,
  sub: /\b(take away|taken away|left|less than|difference|subtract|minus|went down by|down by|turned back|count back|before the end|torn out|used|spent|paid|took)\b/gi,
  mul: /\b(each|every)\b/gi,
  div: /\b(evenly|equally|same number|shared|share|each)\b/gi,
};
const OP_MEANING = {
  add: 'Adding puts two amounts together into one bigger amount.',
  sub: 'Subtracting starts with an amount and takes some away, or finds the difference.',
  mul: 'Multiplying is for equal groups: a number of groups with the same amount in each.',
  div: 'Dividing shares a total out equally, the same amount in each group.',
};
const OP_CLUE_HINT = {
  add: 'Two amounts are being put together. Look for words like "more", "in all" or "altogether".',
  sub: 'Something is taken away, used up, or compared. Look for words like "left", "take away" or "difference".',
  mul: 'There are equal groups: a number of groups, with the same amount in each one. Look for "each".',
  div: 'A total is shared out evenly into groups. Look for "evenly" or "the same number in each".',
};

/* clue text with the numbers in bold, and (optionally) the clue words for one operation marked */
function clueHTML(text, markOp) {
  let h = esc(text);
  if (markOp) h = h.replace(CLUE_WORDS[markOp], m => `<mark>${m}</mark>`);
  return h.replace(/\d[\d,]*/g, m => `<b class="num">${m}</b>`);
}
function eqNumbers(p) { return p.op === 'div' ? [p.N, p.d] : [p.a, p.b]; }

function createEqBuilder(root, p, opts) {
  // opts.numbers: the numbers to offer (default: the two in this step); opts.want: their indexes in order
  const nums = opts.numbers || eqNumbers(p);
  const want = opts.want || [0, 1];
  const chips = shuffle(makeRng('eq', p.ans, nums.join('-')), nums.map((_, i) => i)); // shuffled chip order
  const st = { slots: [null, null], op: null, misses: 0, coach: null, done: false };
  const title = opts.title || 'Step 1 · Build the equation';
  function coach(kind, msg) { st.coach = { kind, msg }; }

  function render() {
    if (!root.isConnected) return;
    if (st.done) {
      root.innerHTML = `<div class="eq-builder done"><div class="eyebrow">${esc(title)}</div>
        <div class="eq-row big"><span class="eq-box filled">${fmt(nums[want[0]])}</span><span class="eq-op filled">${OP_SYMBOL[p.op]}</span><span class="eq-box filled">${fmt(nums[want[1]])}</span><span class="eq-eq">=</span><span class="eq-box ans">?</span></div>
        <p class="eq-yes">✅ That's the equation! Now crack the ${opts.lockWord || 'safe'} to find the answer.</p></div>`;
      return;
    }
    const box = (k) => st.slots[k] == null
      ? `<button type="button" class="eq-box empty" data-e="slot" data-k="${k}" aria-label="Empty number box">?</button>`
      : `<button type="button" class="eq-box filled" data-e="slot" data-k="${k}" aria-label="${fmt(nums[st.slots[k]])}, tap to remove">${fmt(nums[st.slots[k]])}</button>`;
    const opBox = st.op ? `<span class="eq-op filled">${OP_SYMBOL[st.op]}</span>` : `<span class="eq-op empty">?</span>`;
    const chipBtns = chips.map(i => `<button type="button" class="eq-chip ${opts.carried === i ? 'carried' : ''}" data-e="num" data-i="${i}" ${st.slots.includes(i) ? 'disabled' : ''}>${fmt(nums[i])}${opts.carried === i ? '<small>Lock 1 answer</small>' : ''}</button>`).join('');
    const glow = st.misses >= 2 ? p.op : null;
    const opBtns = ['add', 'sub', 'mul', 'div'].map(o => `<button type="button" class="eq-sign ${st.op === o ? 'on' : ''} ${glow === o ? 'glow' : ''}" data-e="op" data-o="${o}" aria-pressed="${st.op === o}" aria-label="${OP_NAME[o]}">${OP_SYMBOL[o]}</button>`).join('');
    const instr = opts.intro || 'Build the equation. Tap the numbers from the clue to put them in the boxes, and pick the sign.';
    root.innerHTML = `<div class="eq-builder">
      <div class="eyebrow">${esc(title)}</div>
      <p class="eq-instr">${esc(instr)} ${sayBtn(instr, FELIX.voice, 'Read the instructions')}</p>
      <div class="eq-row">${box(0)}${opBox}${box(1)}<span class="eq-eq">=</span><span class="eq-box ans">?</span></div>
      <div class="eq-pick"><div class="eq-label">Numbers</div><div class="eq-chips">${chipBtns}</div></div>
      <div class="eq-pick"><div class="eq-label">Sign</div><div class="eq-signs">${opBtns}</div></div>
      ${st.coach ? `<div class="coach ${st.coach.kind}" aria-live="polite"><span class="coach-e">🦊</span><span>${st.coach.msg}</span>${sayBtn(st.coach.msg.replace(/<[^>]+>/g, ''), FELIX.voice, 'Read Felix\'s tip')}</div>` : ''}
      <div class="stage-actions"><button type="button" class="btn primary big" data-e="check">Check my equation ✔</button></div>
    </div>`;
  }

  function check() {
    if (st.slots.includes(null) || !st.op) {
      coach('remind', st.op ? 'Put both numbers in the boxes first.' : 'Pick a sign: plus, minus, times or divided by.');
      return render();
    }
    const commutes = p.op === 'add' || p.op === 'mul';
    const sameSet = [...st.slots].sort().join() === [...want].sort().join();
    const inOrder = st.slots[0] === want[0] && st.slots[1] === want[1];
    if (!sameSet) {
      st.misses++; SFX.boop();
      coach('miss', opts.wrongNumbers || 'Not those two numbers. Which two numbers go together first in the story? The other number is for the second lock.');
      return render();
    }
    if (st.op === p.op && (commutes || inOrder)) {
      st.done = true; SFX.chime();
      const firstTry = st.misses === 0;
      if (opts.onDone) opts.onDone({ firstTry, misses: st.misses });
      return render();
    }
    st.misses++; SFX.boop();
    if (st.op === p.op) {
      const start = p.op === 'div' ? 'the total that is being shared' : 'the amount we start with';
      coach('miss', `The sign is right! But which number comes first? For ${OP_NAME[p.op].toLowerCase()}, start with ${start}: <b>${fmt(nums[want[0]])}</b>.`);
    } else {
      coach('miss', `Hmm, not ${OP_SYMBOL[st.op]}. ${OP_MEANING[st.op]} Read the clue again: ${OP_CLUE_HINT[p.op]}`);
      if (opts.onMiss) opts.onMiss(p.op);
    }
    render();
  }

  root.addEventListener('click', (e) => {
    const b = e.target.closest('[data-e]'); if (!b || !root.contains(b) || b.disabled || st.done) return;
    const k = b.dataset.e;
    if (k === 'num') { const i = Number(b.dataset.i); const at = st.slots.indexOf(null); if (at >= 0) { st.slots[at] = i; SFX.click(); } }
    else if (k === 'slot') { st.slots[Number(b.dataset.k)] = null; SFX.click(); }
    else if (k === 'op') { st.op = b.dataset.o; SFX.tumbler(); }
    else if (k === 'check') return check();
    st.coach = null; render();
  });
  render();
}

/* ============================================================
   Solve flow: equation step(s) then safe(s).
   One-step problem: build the equation, crack the safe.
   Double Lock (two-step): Lock 1 equation (pick 2 of the 3 numbers),
   Lock 1 safe, Lock 2 equation (Lock 1's answer and the last number), Lock 2 safe.
   ============================================================ */
function solveFlow(root, p, o) {
  // o: { lab, seedKey, tokenEmoji, skipEq, eqDone, onEqDone(r), onMiss(op), onSolved(agg) -> stars }
  root.innerHTML = '';
  const two = p.op === 'two';
  const steps = two ? p.steps : [p];
  const agg = { misses: 0, capped: false, firstTry: true, eqFirst: true };
  const nums1 = two ? [p.steps[0].op === 'div' ? p.N : p.a, p.steps[0].op === 'div' ? p.d : p.b, p.c] : null;

  function runStep(k) {
    const sp = steps[k];
    const eqEl = document.createElement('div'), safeEl = document.createElement('div');
    eqEl.className = 'flow-eq'; safeEl.className = 'flow-safe';
    root.append(eqEl, safeEl);
    const startSafe = () => {
      createCipher(safeEl, sp, {
        lab: o.lab, seedKey: `${o.seedKey}-${k}`, tokenEmoji: o.tokenEmoji,
        lockLabel: two ? `LOCK ${k + 1} OF 2` : null,
        partial: two && k === 0 ? 'LOCK 1 OPEN!' : null,
        onSolved(res) {
          agg.misses += res.misses; agg.capped = agg.capped || res.capped; agg.firstTry = agg.firstTry && res.firstTry;
          if (two && k === 0) { setTimeout(() => runStep(1), 900); return 0; }
          return o.onSolved ? o.onSolved(agg) : 0;
        },
      });
      setTimeout(() => { if (safeEl.isConnected && (two || !o.eqDone)) safeEl.scrollIntoView({ block: 'start', behavior: REDUCED() ? 'auto' : 'smooth' }); }, 60);
    };
    if (o.skipEq || (!two && o.eqDone)) { startSafe(); return; }
    const eqOpts = {
      onMiss: o.onMiss,
      onDone(r) { agg.eqFirst = agg.eqFirst && r.firstTry; if (o.onEqDone) o.onEqDone(r, k); startSafe(); },
    };
    if (two && k === 0) Object.assign(eqOpts, { numbers: nums1, want: [0, 1], title: 'Lock 1 of 2 · Build the first equation', lockWord: 'first lock',
      intro: 'This safe has two locks! The clue has three numbers. Pick the two numbers that go together first, and the sign.' });
    if (two && k === 1) {
      Object.assign(eqOpts, { numbers: [sp.a, sp.b], want: [0, 1], carried: 0, title: 'Lock 2 of 2 · Build the second equation', lockWord: 'second lock',
        intro: 'Now use the Lock 1 answer and the last number from the clue. Which sign finishes the story?' });
      setTimeout(() => { if (eqEl.isConnected) eqEl.scrollIntoView({ block: 'start', behavior: REDUCED() ? 'auto' : 'smooth' }); }, 60);
    }
    createEqBuilder(eqEl, sp, eqOpts);
  }
  runStep(0);
}

/* ============================================================
   Flashlight scanner: a dark scene, a lens that follows the pointer,
   one required evidence spot and bonus spots.
   ============================================================ */
function createScanner(canvas, cfg) {
  // cfg: { theme, evidence, bonus:[e,e], seed, lensId, found:{evidence, bonus:[b,b]}, onFind(kind, idx), onDecoy(e), onHint(text) }
  const theme = THEMES[cfg.theme] || THEMES.museum;
  const rng = makeRng('scan', cfg.seed);
  const lens = SHOP.lenses.find(l => l.id === cfg.lensId) || SHOP.lenses[0];
  const ctx = canvas.getContext('2d');
  const scene = document.createElement('canvas'), sctx = scene.getContext('2d');
  const dark = document.createElement('canvas'), dctx = dark.getContext('2d');
  let W = 0, H = 0, dpr = 1;
  const pos = { x: 0.5, y: 0.5 }; // normalized lens position
  const t0 = performance.now();
  let lastFindT = t0, hintShown = false, alive = true;

  // place spots
  const spots = [];
  function place(e, kind, size, idx = 0) {
    for (let tries = 0; tries < 300; tries++) {
      const x = 0.08 + rng() * 0.84, y = 0.14 + rng() * 0.74;
      if (spots.every(s => Math.hypot((s.x - x) * 1.6, s.y - y) > 0.2)) { spots.push({ e, kind, size, x, y, idx }); return; }
    }
    spots.push({ e, kind, size, x: 0.1 + rng() * 0.8, y: 0.2 + rng() * 0.6, idx });
  }
  place(cfg.evidence.e, 'evidence', 0.07);
  (cfg.bonus || ['🔎', '🔎']).forEach((e, i) => place(e, 'bonus', 0.055, i));
  const avoid = new Set([cfg.evidence.e, ...(cfg.bonus || [])]);
  shuffle(rng, theme.props.filter(e => !avoid.has(e))).forEach(e => place(e, 'decoy', 0.085));
  // decorations (not interactive)
  const decor = Array.from({ length: 28 }, () => ({ x: rng(), y: rng() * 0.7, r: rng() * 1.6 + 0.4 }));

  function isFound(s) { return s.kind === 'evidence' ? cfg.found.evidence : s.kind === 'bonus' ? cfg.found.bonus[s.idx] : false; }

  function resize() {
    const r = canvas.getBoundingClientRect();
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = Math.max(200, r.width); H = Math.round(W * 0.6);
    canvas.style.height = H + 'px';
    for (const c of [canvas, scene, dark]) { c.width = Math.round(W * dpr); c.height = Math.round(H * dpr); }
    drawScene();
  }

  function drawScene() {
    const g = sctx; g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const grad = g.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, theme.sky[0]); grad.addColorStop(1, theme.sky[1]);
    g.fillStyle = grad; g.fillRect(0, 0, W, H);
    g.fillStyle = 'rgba(255,255,255,0.35)';
    for (const d of decor) { g.beginPath(); g.arc(d.x * W, d.y * H, d.r, 0, Math.PI * 2); g.fill(); }
    g.fillStyle = theme.floor; g.fillRect(0, H * 0.78, W, H * 0.22);
    g.fillStyle = 'rgba(0,0,0,0.18)'; for (let x = 0; x < W; x += 46) g.fillRect(x, H * 0.78, 2, H * 0.22);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    for (const s of spots) {
      if (isFound(s)) continue;
      const fs = Math.max(20, Math.min(54, s.size * W));
      g.font = `${fs}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
      g.globalAlpha = s.kind === 'decoy' ? 1 : 0.92;
      g.fillText(s.e, s.x * W, s.y * H);
    }
    g.globalAlpha = 1;
  }

  function lensR() { return Math.max(44, Math.min(84, W * 0.13)); }

  function frame(now) {
    if (!alive) return;
    if (!canvas.isConnected) { alive = false; return; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(scene, 0, 0, W, H);
    // darkness with a soft lens cut-out
    const R = lensR(), lx = pos.x * W, ly = pos.y * H;
    dctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    dctx.globalCompositeOperation = 'source-over';
    dctx.clearRect(0, 0, W, H);
    dctx.fillStyle = 'rgba(3,7,16,0.94)'; dctx.fillRect(0, 0, W, H);
    dctx.globalCompositeOperation = 'destination-out';
    const rg = dctx.createRadialGradient(lx, ly, R * 0.55, lx, ly, R);
    rg.addColorStop(0, 'rgba(0,0,0,1)'); rg.addColorStop(1, 'rgba(0,0,0,0)');
    dctx.fillStyle = rg; dctx.beginPath(); dctx.arc(lx, ly, R, 0, Math.PI * 2); dctx.fill();
    dctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(dark, 0, 0, W, H);
    // gentle pulse at the evidence after a while
    const elapsed = now - lastFindT;
    if (!cfg.found.evidence && elapsed > 18000) {
      const ev = spots.find(s => s.kind === 'evidence');
      const a = REDUCED() ? 0.45 : 0.25 + 0.25 * Math.sin(now / 300);
      ctx.strokeStyle = `rgba(233,207,148,${a})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(ev.x * W, ev.y * H, 26 + (REDUCED() ? 0 : 6 * Math.sin(now / 300)), 0, Math.PI * 2); ctx.stroke();
      if (!hintShown) { hintShown = true; cfg.onHint && cfg.onHint(directionHint(ev)); }
    }
    // lens rim + handle
    let stroke;
    if (lens.rim === 'rainbow') {
      if (ctx.createConicGradient) { stroke = ctx.createConicGradient(now / 1500, lx, ly); ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#c77dff', '#ff6b6b'].forEach((c, i) => stroke.addColorStop(i / 5, c)); }
      else stroke = '#ffd93d';
    } else { stroke = ctx.createLinearGradient(lx - R, ly - R, lx + R, ly + R); stroke.addColorStop(0, lens.rim[0]); stroke.addColorStop(1, lens.rim[1]); }
    ctx.lineCap = 'round';
    ctx.strokeStyle = stroke; ctx.lineWidth = 12;
    const hx = lx + R * 0.72, hy = ly + R * 0.72;
    ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx + R * 0.55, hy + R * 0.55); ctx.stroke();
    ctx.lineWidth = 7; ctx.beginPath(); ctx.arc(lx, ly, R - 2, 0, Math.PI * 2); ctx.stroke();
    if (lens.sparkle) {
      ctx.fillStyle = '#fff';
      for (let i = 0; i < 5; i++) {
        const ang = (REDUCED() ? 0 : now / 900) + i * 1.257, rr = R + 6;
        const sz = 1.5 + (REDUCED() ? 1 : Math.abs(Math.sin(now / 250 + i)) * 2);
        ctx.beginPath(); ctx.arc(lx + Math.cos(ang) * rr, ly + Math.sin(ang) * rr, sz, 0, Math.PI * 2); ctx.fill();
      }
    }
    requestAnimationFrame(frame);
  }

  function directionHint(s) {
    const v = s.y < 0.4 ? 'top' : s.y > 0.65 ? 'bottom' : 'middle';
    const h = s.x < 0.38 ? 'left' : s.x > 0.62 ? 'right' : '';
    const where = v === 'middle' ? (h ? `on the ${h} side` : 'right in the middle') : (h ? `near the ${v}-${h}` : `near the ${v}`);
    return `Psst! Try looking ${where}. I see something glinting there!`;
  }

  function setPos(clientX, clientY) {
    const r = canvas.getBoundingClientRect();
    pos.x = Math.max(0, Math.min(1, (clientX - r.left) / r.width));
    pos.y = Math.max(0, Math.min(1, (clientY - r.top) / r.height));
  }
  function tryCollect() {
    const px = pos.x * W, py = pos.y * H;
    let best = null, bd = Infinity;
    for (const s of spots) {
      if (isFound(s)) continue;
      const d = Math.hypot(s.x * W - px, s.y * H - py);
      if (d < bd) { bd = d; best = s; }
    }
    if (!best || bd > 38) return;
    if (best.kind === 'decoy') { cfg.onDecoy && cfg.onDecoy(best.e); return; }
    if (best.kind === 'evidence') cfg.found.evidence = true; else cfg.found.bonus[best.idx] = true;
    lastFindT = performance.now();
    drawScene();
    cfg.onFind && cfg.onFind(best.kind, best.idx, best.e);
  }

  canvas.addEventListener('pointermove', (e) => { setPos(e.clientX, e.clientY); });
  canvas.addEventListener('pointerdown', (e) => { setPos(e.clientX, e.clientY); tryCollect(); });
  canvas.addEventListener('keydown', (e) => {
    const step = 0.05;
    if (e.key === 'ArrowLeft') pos.x = Math.max(0, pos.x - step);
    else if (e.key === 'ArrowRight') pos.x = Math.min(1, pos.x + step);
    else if (e.key === 'ArrowUp') pos.y = Math.max(0, pos.y - step * 1.6);
    else if (e.key === 'ArrowDown') pos.y = Math.min(1, pos.y + step * 1.6);
    else if (e.key === 'Enter' || e.key === ' ') tryCollect();
    else return;
    e.preventDefault();
  });
  const ro = new ResizeObserver(() => { if (!canvas.isConnected) { ro.disconnect(); return; } if (Math.abs(canvas.getBoundingClientRect().width - W) > 1) resize(); });
  ro.observe(canvas);
  resize();
  requestAnimationFrame(frame);
  return { stop() { alive = false; ro.disconnect(); } };
}

/* ============================================================
   Screens: welcome, map, case (story → search → safe → check → arrest),
   lab, shop, treehouse, parent menu
   ============================================================ */
const ui = { checkMarks: new Set(), shopTab: 'hats', lab: null, decoyToastAt: 0, holdTimer: null, holdDone: false };

function newRun() {
  return {
    seed: Math.floor(Math.random() * 1e9), scene: 0, stage: 'story',
    found: [0, 1, 2, 3].map(() => ({ evidence: false, bonus: [false, false] })),
    problems: [null, null, null, null], solved: [false, false, false, false], sceneStars: [0, 0, 0, 0],
    ruledOut: [], caseStars: 0, firstTries: 0,
  };
}
function curCase() { return { i: S.caseIdx, c: CASES[S.caseIdx], cs: S.cases[S.caseIdx], run: S.cases[S.caseIdx].run }; }
function ensureProblem(i, s) {
  const run = S.cases[i].run;
  if (!run.problems[s]) {
    const level = caseLevel(i, S.settings), sc = CASES[i].scenes[s];
    run.problems[s] = sc.op === 'two'
      ? genTwoStep(sc.kind, twoStepLevel(CASES[i], level), makeRng(run.seed, i, s, level, 'two'))
      : genProblem(sc.op, level, makeRng(run.seed, i, s, level));
    save();
  }
  return run.problems[s];
}
/* Double Lock numbers stay a notch smaller than one-step safes: two steps is the challenge */
function twoStepLevel(c, level) { return Math.max(1, Math.min(3, level - (c.season <= 4 ? 2 : 1))); }
function distinctClosed() { return S.cases.filter(c => c.status === 'closed').length; }

      <div class="scan-head"><div><div class="eyebrow on-desk">Scene ${s + 1} · Search ${esc(sc.place)}</div><h2>Find the evidence: ${esc(sc.evidence.label)}</h2></div><div class="bonus-count" id="bonusCount">Bonus clues <b>${nb}/2</b></div></div>
      <p class="scan-tip" id="scanTip">🦊 It's dark in here! Move your flashlight around. When you spot something, tap it.</p>
      <div class="scan-wrap"><canvas id="scanner" tabindex="0" aria-label="A dark room. Move the flashlight with your finger, mouse, or arrow keys. Tap, or press Enter, to pick something up."></canvas></div>

    ensureProblem(i, s);
    createScanner($('#scanner'), {
      theme: c.theme, evidence: sc.evidence, bonus: sc.bonus || ['🔎', '🔎'], seed: `${run.seed}-${i}-${s}`, lensId: S.equipped.lens, found: f,
      onFind(kind, idx, e) {
        if (kind === 'evidence') {
          SFX.found(); earnBadge('first_clue'); save();
          $('#foundPanel').innerHTML = foundPanelHTML();
          $('#scanTip').textContent = `🦊 You found it! ${f.bonus.every(Boolean) ? '' : 'There may be bonus clues hiding too. Or crack the safe when you\'re ready.'}`;
          $('#foundPanel').scrollIntoView({ block: 'nearest', behavior: REDUCED() ? 'auto' : 'smooth' });
        } else {
          SFX.coin(); S.tokens++; S.stats.tokensFound++; run.caseStars += 2; awardStars(2); checkStatBadges(); save();
          const special = { '🎭': 'A rubber mask with a beak?! Someone is in disguise!', '🧦': 'One stripy sock... black and grey, like a raccoon\'s tail!' }[e];
          toast(`${special ? `<b>${e} ${special}</b><br>` : `<b>Bonus clue!</b> `}+1 🔎 &nbsp;+2 ⭐`, special ? 4200 : 2600);
          $('#bonusCount').innerHTML = `Bonus clues <b>${f.bonus.filter(Boolean).length}/2</b>`;
          const ch = $('.case-meta .pill'); if (ch) ch.textContent = `⭐ ${run.caseStars}`;
          refreshHud();
        }
      },
      onDecoy(e) {
        const now = Date.now(); if (now - ui.decoyToastAt < 1800) return; ui.decoyToastAt = now;
        SFX.click(); toast(pick(Math.random, [`Just a ${e}. Not a clue!`, `${e}? Nice, but not evidence.`, `Hmm, a ${e}. Keep looking!`]), 1600);
      },
      onHint(text) { const t = $('#scanTip'); if (t) t.textContent = '🦊 ' + text; },
    });
    return;
  }
  if (run.stage === 'cipher') {
    const p = ensureProblem(i, s);
    const text = fillText(sc.problem, p);
    st.innerHTML = `<div class="paper clue-card"><div class="eyebrow">The clue · ${sc.cat.e} ${esc(sc.cat.label)}</div><p class="problem" id="clueText">${clueHTML(text)}</p><div class="read-row">${sayBtn(text, NARRATOR, 'Read the clue')}<span class="muted tiny">Read it to me</span></div></div>
      <div id="cipherRoot"></div><div id="afterSolve"></div>`;
    if (S.settings.autoRead) speak(text, NARRATOR);

      $('#cipherRoot').innerHTML = `<div class="safe open"><div class="safe-inside"><div class="stamp cracked">CRACKED!</div><div class="cracked-ans">${equationText(p)} = <b>${fmt(p.ans)}</b></div><div class="stars-pop">+${run.sceneStars[s]} ⭐</div></div></div>`;

      onMiss(op) { const el = $('#clueText'); if (el) el.innerHTML = clueHTML(text, op); },
      onEqDone(r) {

        run.solved[s] = true; run.sceneStars[s] = stars; run.caseStars += stars;
        run.firstTries = (run.firstTries || 0) + (res.firstTry ? 1 : 0);
        S.stats.ciphersSolved++;
        if (p.op === 'two') S.stats.twoStep = (S.stats.twoStep || 0) + 1;
        if (res.firstTry) { S.stats.firstTryStreak++; S.stats.bestFirstTryStreak = Math.max(S.stats.bestFirstTryStreak, S.stats.firstTryStreak); } else S.stats.firstTryStreak = 0;
        awardStars(stars); checkStatBadges(); save();

function equationStat(r) { S.stats.eqBuilt = (S.stats.eqBuilt || 0) + 1; if (r.firstTry) S.stats.eqFirst = (S.stats.eqFirst || 0) + 1; checkStatBadges(); }

/* ----- check ----- */
function checkHTML() {
  const { i, c, run } = curCase(); const s = run.scene, sc = c.scenes[s];
  const p = ensureProblem(i, s);
  const cards = caseSuspects(c).map((id, k) => {
    const su = SUSPECTS[id], wasOut = run.ruledOut.includes(id), v = suspectValue(c, p, s, id), marked = ui.checkMarks.has(id);
    return `<button type="button" class="suspect-card check ${wasOut ? 'out' : ''} ${marked ? 'marked' : ''}" data-action="checkTap" data-arg="${id}" ${wasOut ? 'disabled' : ''} style="--d:${k * 140}ms" aria-pressed="${marked}">
      <span class="sc-top"><span class="sc-e">${su.e}</span><b>${esc(su.short)}</b></span>
      <span class="sc-val flip">${fmt(v)}</span>
      ${wasOut ? '<span class="stamp tiny">Cleared</span>' : marked ? '<span class="stamp tiny red">No match</span>' : ''}</button>`;
  }).join('');
  const instr = `The thief's ${sc.cat.label.toLowerCase()} is ${fmt(p.ans)}. Tap every suspect whose number does not match. If they all match, tap Done.`;
  return `<section class="paper check-card">
    <div class="eyebrow">Suspect check · Scene ${s + 1}</div>
    <h2>${sc.cat.e} ${esc(sc.cat.label)}: <span class="ans-chip">${fmt(p.ans)}</span></h2>
    <p>The thief's number is <b>${fmt(p.ans)}</b>. Tap every suspect whose number does <b>not</b> match. If they all match, just tap <b>Done</b>. ${sayBtn(instr, NARRATOR, 'Read the instructions')}</p>
    <div class="check-grid">${cards}</div>
    <div id="checkCoach"></div>
    <div class="stage-actions"><button type="button" class="btn primary big" data-action="checkDone">Done checking ✔</button></div>
  </section>`;
}
function checkTap(id) {
  const { i, c, run } = curCase(); const s = run.scene; const p = ensureProblem(i, s);
  const v = suspectValue(c, p, s, id), su = SUSPECTS[id];
  const coachEl = $('#checkCoach');
  if (v === p.ans) {
    SFX.boop();
    coachEl.innerHTML = `<div class="coach miss"><span class="coach-e">🦊</span><span>Look again: ${esc(su.short)}'s number is <b>${fmt(v)}</b>. That matches <b>${fmt(p.ans)}</b>, so ${esc(su.short)} stays on the list.</span></div>`;
    return;
  }
  if (ui.checkMarks.has(id)) ui.checkMarks.delete(id); else { ui.checkMarks.add(id); SFX.stamp(); }
  $('#stage').innerHTML = checkHTML();
}
function checkDone() {
  const { c, run } = curCase(); const s = run.scene; const newly = c.scenes[s].out;
  if (ui.checkMarks.size < newly.length) {
    SFX.boop();
    $('#checkCoach').innerHTML = `<div class="coach miss"><span class="coach-e">🦊</span><span>Hmm, someone here doesn't match yet. Compare each number with the thief's number, one by one.</span></div>`;
    return;
  }
  run.ruledOut.push(...newly);
  if (newly.length) {
    newly.forEach((id, k) => setTimeout(() => toast(`${SUSPECTS[id].e} <b>${esc(SUSPECTS[id].short)}:</b> “${esc(SUSPECTS[id].cleared)}”`, 3400), k * 400));
    speak(SUSPECTS[newly[0]].cleared, SUSPECTS[newly[0]].voice);
  } else toast('🦊 Everyone left still matches. This clue keeps them all on the list. On to the next one!', 3600);
  ui.checkMarks = new Set();
  if (s < 3) { run.scene++; run.stage = 'story'; } else run.stage = 'arrest';

/* ---------------- lab ---------------- */
function newLabProblem() {
  const rng = makeRng('lab', Date.now(), Math.random());
  const op = S.lab.op === 'mix' ? pick(rng, ['add', 'sub', 'mul', 'div']) : S.lab.op;
  let p, tpl;
  if (op === 'two') {
    const kind = pick(rng, ['add-sub', 'mul-add', 'mul-sub', 'div-add']);
    p = genTwoStep(kind, S.lab.level, rng); tpl = pick(rng, LAB_TWO_TEMPLATES[kind]);
  } else { p = genProblem(op, S.lab.level, rng); tpl = pick(rng, LAB_TEMPLATES[op]); }
  ui.lab = { p, tpl, text: fillText(tpl.text, p), solved: false };
}
function labHTML() {
  if (!ui.lab) newLabProblem();
  const ops = [['mix', '🎲 Mix'], ['add', '+ Add'], ['sub', '− Subtract'], ['mul', '× Multiply'], ['div', '÷ Divide'], ['two', '🔐 Double Lock']];
  const { p, tpl, text } = ui.lab;
  return `<section class="lab-head"><div><div class="eyebrow on-desk">Agency training lab</div><h1 class="display">Training Lab 🧪</h1><p class="on-desk-muted">Practice any skill. Every safe you crack earns stars. Hints are free in the Lab.</p></div></section>
    <div class="chip-row" role="group" aria-label="Operation">${ops.map(([id, l]) => `<button type="button" class="chip ${S.lab.op === id ? 'on' : ''}" data-action="labOp" data-arg="${id}" aria-pressed="${S.lab.op === id}">${l}</button>`).join('')}</div>
    <div class="chip-row" role="group" aria-label="Level">${[1, 2, 3].map(l => `<button type="button" class="chip ${S.lab.level === l ? 'on' : ''}" data-action="labLevel" data-arg="${l}" aria-pressed="${S.lab.level === l}">Level ${l}</button>`).join('')}</div>
    <div class="lab-grid"><div><div class="paper clue-card"><div class="eyebrow">Training puzzle · Level ${p.level}</div><p class="problem">${tpl.e} <span id="clueText">${clueHTML(text)}</span></p><div class="read-row">${sayBtn(text, NARRATOR, 'Read the puzzle')}<span class="muted tiny">Read it to me</span></div></div>
    <div id="cipherRoot"></div><div id="afterSolve"></div></div></div>`;
}
function mountLab() {
  const { p, text } = ui.lab;
  solveFlow($('#cipherRoot'), p, {
    lab: true, seedKey: 'lab', tokenEmoji: LAB_TOKENS[p.op === 'two' ? p.steps[0].op : p.op], eqDone: ui.lab.eqDone,
    onMiss(op) { const el = $('#clueText'); if (el) el.innerHTML = clueHTML(text, op); },
    onEqDone(r) { if (p.op !== 'two') ui.lab.eqDone = true; equationStat(r); save(); const el = $('#clueText'); if (el) el.innerHTML = clueHTML(text); },
    onSolved(res) {
      const stars = starsFor(res.misses, res.capped, true) * (p.op === 'two' ? 2 : 1);
      S.stats.labSolved++; S.stats.ciphersSolved++;
      if (p.op === 'two') S.stats.twoStep = (S.stats.twoStep || 0) + 1;
      if (res.firstTry) { S.stats.firstTryStreak++; S.stats.bestFirstTryStreak = Math.max(S.stats.bestFirstTryStreak, S.stats.firstTryStreak); } else S.stats.firstTryStreak = 0;
      awardStars(stars); checkStatBadges(); save(); ui.lab.solved = true;
      setTimeout(() => { const a = $('#afterSolve'); if (a) { a.innerHTML = `<div class="after-solve"><p class="felix-line">🦊 “${res.misses === 0 ? 'Perfect crack!' : 'Cracked it! Practice makes detectives.'}” <span class="muted">Lab puzzles solved: ${S.stats.labSolved}</span></p><button type="button" class="btn primary big" data-action="labNext" data-focus>Next puzzle ▶</button></div>`; a.scrollIntoView({ block: 'nearest', behavior: REDUCED() ? 'auto' : 'smooth' }); } }, 50);
      return stars;
    },
  });
}

const SPEED_SECONDS = 180;
ui.chal = null; // { mode: 'daily', p, tpl, text } | { mode: 'speed', ... }

function dayKey(d = new Date()) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function yesterdayKey() { const d = new Date(); d.setDate(d.getDate() - 1); return dayKey(d); }
function dailyDoneToday() { return S.daily.last === dayKey(); }
function liveStreak() { return S.daily.last === dayKey() || S.daily.last === yesterdayKey() ? S.daily.streak : 0; }
function dailyLevel() { const n = distinctClosed(); return n >= 24 ? 3 : n >= 12 ? 2 : 1; }

function newDailyPuzzle() {
  const key = dayKey(), rng = makeRng('daily', key);
  const kind = pick(rng, ['add-sub', 'mul-add', 'mul-sub', 'div-add']);
  const p = genTwoStep(kind, dailyLevel(), rng), tpl = pick(rng, LAB_TWO_TEMPLATES[kind]);
  return { mode: 'daily', key, p, tpl, text: fillText(tpl.text, p) };
}

/* ---------- speed safe: quick facts ---------- */
function speedProblem(rng, n) {
  const r = (lo, hi) => lo + Math.floor(rng() * (hi - lo + 1));
  const op = pick(rng, ['add', 'sub', 'mul', 'div', 'mul', 'add']);
  const big = n >= 10; // after 10 safes, the numbers grow
  if (op === 'add') { const a = r(big ? 25 : 11, big ? 89 : 59), b = r(big ? 15 : 6, big ? 79 : 39); return { op, a, b, ans: a + b }; }
  if (op === 'sub') { const a = r(big ? 40 : 20, big ? 99 : 80), b = r(big ? 12 : 4, a - (big ? 5 : 3)); return { op, a, b, ans: a - b }; }
  const x = r(2, big ? 9 : 6), y = r(2, 9);
  if (op === 'mul') return { op, a: x, b: y, ans: x * y };
  return { op, a: x * y, b: x, ans: y };
}
function speedEq(q) { return `${q.a} ${OP_SYMBOL[q.op]} ${q.b}`; }

function startSpeed() {
  stopSpeed();
  const rng = makeRng('speed', Date.now(), Math.random());
  ui.chal = { mode: 'speed', rng, score: 0, entry: '', misses: 0, q: speedProblem(rng, 0), end: Date.now() + SPEED_SECONDS * 1000, over: false, skipped: 0 };
  render();
  ui.speedTimer = setInterval(speedTick, 250);
}
function stopSpeed() { if (ui.speedTimer) { clearInterval(ui.speedTimer); ui.speedTimer = null; } }
function speedTick() {
  const c = ui.chal; if (!c || c.mode !== 'speed' || S.screen !== 'challenges') { stopSpeed(); return; }
  const left = Math.max(0, c.end - Date.now());
  const bar = $('#speedBar'), t = $('#speedTime');
  if (bar) bar.style.width = (left / (SPEED_SECONDS * 10)) + '%';
  if (t) t.textContent = fmtClock(left);
  if (left <= 10000 && bar) bar.classList.add('hurry');
  if (left <= 0) finishSpeed();
}
function fmtClock(ms) { const s = Math.ceil(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }
function finishSpeed() {
  const c = ui.chal; stopSpeed(); if (!c || c.over) return;
  c.over = true;
  const newBest = c.score > S.speed.best;
  c.wasBest = S.speed.best; c.newBest = newBest;
  S.speed.best = Math.max(S.speed.best, c.score); S.speed.rounds++; S.speed.total += c.score;
  c.stars = c.score * 2 + (newBest && c.score > 0 ? 10 : 0);
  awardStars(c.stars); checkStatBadges(); save();
  SFX.fanfare(); if (newBest && c.score > 0) confetti();
  render();
}
function speedKey(v) {
  const c = ui.chal; if (!c || c.mode !== 'speed' || c.over) return;
  if (v === 'back') c.entry = c.entry.slice(0, -1);
  else if (v === 'go') return speedTry();
  else if (v === 'skip') { c.skipped++; c.q = speedProblem(c.rng, c.score); c.entry = ''; c.misses = 0; SFX.boop(); }
  else if (c.entry.length < 3) { c.entry += v; SFX.click(); }
  paintSpeed();
}
function speedTry() {
  const c = ui.chal; if (!c.entry) return;
  if (Number(c.entry) === c.q.ans) {
    c.score++; S.stats.ciphersSolved++; SFX.coin();
    flashSpeed('good');
    c.q = speedProblem(c.rng, c.score); c.entry = ''; c.misses = 0;
  } else {
    c.misses++; SFX.boop(); flashSpeed('bad');
    if (c.misses >= 2) { toast(`🦊 ${speedEq(c.q)} = <b>${c.q.ans}</b>. Next one!`, 1800); c.q = speedProblem(c.rng, c.score); c.misses = 0; }
    c.entry = '';
  }
  paintSpeed();
}
function flashSpeed(kind) { const el = $('#speedCard'); if (!el) return; el.classList.remove('good', 'bad'); void el.offsetWidth; el.classList.add(kind); }
function paintSpeed() {
  const c = ui.chal; const eq = $('#speedEq'), ans = $('#speedAns'), sc = $('#speedScore');
  if (eq) eq.textContent = speedEq(c.q) + ' =';
  if (ans) { ans.textContent = c.entry || '?'; ans.classList.toggle('empty', !c.entry); }
  if (sc) sc.textContent = c.score;
}

    lab: true, seedKey: 'daily', tokenEmoji: LAB_TOKENS[p.steps[0].op],
    onMiss(op) { const el = $('#clueText'); if (el) el.innerHTML = clueHTML(text, op); },
    onEqDone(r) { equationStat(r); save(); const el = $('#clueText'); if (el) el.innerHTML = clueHTML(text); },
    onSolved(res) {
      if (dailyDoneToday()) return 0; // solved in another tab
      const streak = S.daily.last === yesterdayKey() ? S.daily.streak + 1 : 1;
      S.daily = { last: dayKey(), streak, best: Math.max(S.daily.best, streak), total: S.daily.total + 1 };
      const stars = 20 + 5 * Math.min(streak - 1, 6) + (res.misses === 0 ? 5 : 0);
      S.stats.ciphersSolved++; S.stats.twoStep = (S.stats.twoStep || 0) + 1;
      awardStars(stars); checkStatBadges(); save();
      setTimeout(() => {
        const a = $('#afterSolve'); if (!a) return;
        a.innerHTML = `<div class="after-solve"><p class="felix-line">🦊 “Case file closed! ${streak > 1 ? `That's <b>${streak} days in a row</b>! 🔥` : 'Come back tomorrow to start a streak! 🔥'}”</p><button type="button" class="btn primary big" data-action="chalBack" data-focus>Back to Challenges ▶</button></div>`;
        a.scrollIntoView({ block: 'nearest', behavior: REDUCED() ? 'auto' : 'smooth' });
      }, 50);
      return stars;
    },
  });
}

function speedHTML() {
  const c = ui.chal;
  if (c.over) {
    const msg = c.score === 0 ? 'Every detective starts somewhere. Try again!' : c.newBest ? `A new best! Your old best was ${c.wasBest}.` : `Your best is still ${S.speed.best}. So close!`;
    return `<section class="lab-head"><div><div class="eyebrow on-desk">Speed Safe</div><h1 class="display">Time's up! ⏱️</h1></div></section>
      <div class="paper speed-result"><div class="big-art">${c.newBest && c.score ? '🏆' : '⚡'}</div><h2>You cracked <b>${c.score}</b> ${c.score === 1 ? 'safe' : 'safes'}!</h2><p>${msg}</p><p class="gold">+${c.stars} ⭐</p>
      <div class="row-btns"><button type="button" class="btn primary big" data-action="speedStart" data-focus>Play again ⚡</button><button type="button" class="btn ghost" data-action="chalBack">Back to Challenges</button></div></div>`;
  }
  const keys = [1, 2, 3, 4, 5, 6, 7, 8, 9, 0].map(v => `<button type="button" class="key" data-action="speedKey" data-arg="${v}">${v}</button>`).join('');
  return `<section class="lab-head"><div><div class="eyebrow on-desk">Speed Safe</div><h1 class="display">Crack it quick! ⚡</h1></div>
      <button type="button" class="btn small ghost on-desk-btn" data-action="speedQuit">✕ Stop</button></section>
    <div class="paper speed-run">
      <div class="speed-top"><span class="speed-time">⏱️ <b id="speedTime">${fmtClock(c.end - Date.now())}</b></span><span class="speed-score">🔓 <b id="speedScore">${c.score}</b></span></div>
      <div class="speed-track"><i id="speedBar"></i></div>
      <div class="speed-card" id="speedCard"><span id="speedEq">${speedEq(c.q)} =</span><span id="speedAns" class="speed-ans ${c.entry ? '' : 'empty'}">${c.entry || '?'}</span></div>
      <div class="keypad">${keys}</div>
      <div class="key-actions"><button type="button" class="key wide ghost" data-action="speedKey" data-arg="skip">Skip ⏭</button><button type="button" class="key wide ghost" data-action="speedKey" data-arg="back" aria-label="Delete last digit">⌫</button><button type="button" class="btn go" data-action="speedKey" data-arg="go">Open 🔓</button></div>
    </div>`;
}

Object.assign(ACTIONS, {
  dailyStart: () => { if (dailyDoneToday()) return; ui.chal = newDailyPuzzle(); render(); window.scrollTo({ top: 0 }); },
  chalBack: () => { stopSpeed(); ui.chal = null; render(); window.scrollTo({ top: 0 }); },
  speedStart: () => startSpeed(),
  speedQuit: () => { stopSpeed(); ui.chal = null; render(); },
  speedKey: (a) => speedKey(a),
});
document.addEventListener('keydown', (e) => {
  const c = ui.chal; if (!c || c.mode !== 'speed' || c.over || S.screen !== 'challenges' || !$('#modal-root').hidden) return;
  if (/^[0-9]$/.test(e.key)) speedKey(e.key);
  else if (e.key === 'Backspace') speedKey('back');
  else if (e.key === 'Enter') { e.preventDefault(); speedKey('go'); }
});

</script>
<script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
</body>
</html>
