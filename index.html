:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
img { max-width: 100%; }
html { overscroll-behavior-y: none; }

/* A detective's night desk: case folders on an ink desk; the safe is the centerpiece of each cipher.
   Single deliberate dark look (no light variant). */
:root {
  color-scheme: dark;
  --desk: #1d2a3a; --desk-2: #24364a; --desk-3: #2f4560; --desk-deep: #121b27;
  --manila: #e9cf94; --manila-2: #dcbc76; --paper: #fbf5e6; --paper-2: #f3ead2; --white: #fffdf7;
  --ink: #1f2a44; --muted-ink: #5b6478;
  --stamp: #c8323c; --stamp-bright: #ff6b72;
  --brass: #d9a441; --brass-2: #a8771f;
  --clue: #2f9e8f; --clue-ink: #1d6b61; --clue-bright: #7fe0cf;
  --cork: #b98a5a; --cork-frame: #7a5532; --wood: #5b3d22;
  --on-desk: #e8eef7; --on-desk-muted: #9fb0c6;
  --steel: #59646f; --steel-2: #343c47; --steel-face: #1c222a;
  --focus: #7fd3ff;
  --shadow: 0 10px 24px rgba(5, 10, 20, .45);
  --f-display: 'Luckiest Guy', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
  --f-body: 'Andika', 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
  --f-type: 'Special Elite', 'Courier New', ui-monospace, monospace;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; font-family: var(--f-body); font-size: 18px; line-height: 1.5; color: var(--on-desk);
  background:
    radial-gradient(1000px 520px at 15% -10%, #2c4260 0, transparent 60%),
    radial-gradient(800px 500px at 110% 30%, #22344a 0, transparent 60%),
    repeating-linear-gradient(93deg, rgba(255,255,255,.013) 0 2px, transparent 2px 11px),
    var(--desk);
  background-attachment: fixed;
  overflow-x: hidden;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--desk-deep); }
button { font: inherit; color: inherit; touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
html { -webkit-tap-highlight-color: transparent; }
.tray, .crate, .key, .chip, .folder { touch-action: manipulation; }
h1, h2, h3 { text-wrap: balance; }
p { margin: .5em 0; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 8px; }
.muted { color: var(--muted-ink); } .tiny { font-size: 14px; } .small-note { font-size: 14px; margin-top: 6px; }
.on-desk-muted { color: var(--on-desk-muted); } .brass { color: var(--brass); }
.display { font-family: var(--f-display); font-weight: 400; letter-spacing: .02em; line-height: 1.05; margin: .1em 0 .2em; }
.eyebrow { font-family: var(--f-type); font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted-ink); }
.eyebrow.on-desk { color: var(--on-desk-muted); }
.center { text-align: center; }
.hide-sm { display: inline; }

/* ---------- buttons ---------- */
.btn { font-weight: 700; font-size: 17px; min-height: 48px; padding: 10px 18px; border-radius: 14px; border: 0; cursor: pointer;
  background: var(--desk-3); color: var(--on-desk); box-shadow: inset 0 -4px 0 rgba(0,0,0,.25); transition: transform .08s, filter .15s;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; }
@media (hover: hover) { .btn:hover:not([disabled]) { filter: brightness(1.08); } }
.btn:active:not([disabled]) { transform: translateY(2px); box-shadow: inset 0 -2px 0 rgba(0,0,0,.25); }
.btn[disabled] { opacity: .55; cursor: default; }
.btn.primary, .btn.go, .btn.buy { background: var(--brass); color: var(--ink); }
.btn.big { font-family: var(--f-display); font-weight: 400; font-size: 22px; letter-spacing: .03em; min-height: 58px; padding: 12px 26px; }
.btn.ghost { background: transparent; box-shadow: inset 0 0 0 2px currentColor; }
.btn.small { min-height: 44px; font-size: 15px; padding: 8px 12px; }
.btn.stamp-btn, .btn.danger-btn { background: var(--stamp); color: #fff; }
.btn.hint { background: #3b4c63; color: var(--on-desk); }
.say { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--brass); color: var(--ink); font-size: 19px; cursor: pointer; flex: none;
  display: inline-grid; place-items: center; box-shadow: inset 0 -3px 0 rgba(0,0,0,.2); vertical-align: middle; }
.read-row { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
.center-row { justify-content: center; }
.row-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
.chip { min-height: 44px; padding: 8px 16px; border-radius: 999px; border: 2px solid rgba(255,255,255,.22); background: transparent; color: var(--on-desk); font-weight: 700; font-size: 16px; cursor: pointer; }
.chip.on { background: var(--brass); color: var(--ink); border-color: var(--brass); }
.chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
.pill { background: rgba(255,255,255,.09); border-radius: 999px; padding: 6px 11px; font-weight: 700; white-space: nowrap; font-size: 16px; }

/* ---------- top bar ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(18, 27, 39, .95); border-bottom: 1px solid rgba(255,255,255,.08); backdrop-filter: blur(6px); }
.topbar-in { max-width: 1160px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding-block: 8px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.brand { display: flex; align-items: center; gap: 8px; background: none; border: 0; cursor: pointer; padding: 4px; min-height: 44px; text-align: left; }
.brand-mark { font-size: 28px; }
.brand-text { font-family: var(--f-display); font-size: 21px; letter-spacing: .03em; color: var(--manila); line-height: 1; }
.brand-text small { display: block; font-family: var(--f-type); font-size: 11px; letter-spacing: .1em; color: var(--on-desk-muted); text-transform: uppercase; margin-top: 3px; }
.nav { display: flex; gap: 4px; margin-left: auto; }
.nav-btn { min-height: 44px; padding: 6px 12px; border-radius: 12px; background: transparent; color: var(--on-desk-muted); border: 0; display: flex; align-items: center; gap: 6px; font-weight: 700; cursor: pointer; }
.nav-btn.on { background: var(--desk-3); color: var(--on-desk); }
.nav-e { font-size: 20px; }
.hud { display: flex; gap: 6px; align-items: center; }
.parent-gear { -webkit-touch-callout: none; position: relative; width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent; cursor: pointer; font-size: 20px; display: grid; place-items: center; touch-action: none; -webkit-user-select: none; user-select: none; }
.parent-gear svg { position: absolute; inset: 0; width: 44px; height: 44px; transform: rotate(-90deg); }
.parent-gear circle { fill: none; stroke: var(--brass); stroke-width: 3; stroke-dasharray: 101; stroke-dashoffset: 101; }
.parent-gear.holding circle { animation: holdFill 2s linear forwards; }
@media (max-width: 1060px) {
  .nav { order: 3; width: 100%; margin-left: 0; justify-content: space-between; }
  .nav-btn { flex: 1; flex-direction: column; gap: 0; padding: 4px; font-size: 14px; }
  .hud { margin-left: auto; }
}
@media (max-width: 680px) { .nav-btn { font-size: 12.5px; } .topbar { position: static; } }
@media (max-width: 440px) { .brand-text small { display: none; } .brand-text { font-size: 19px; } .topbar-in { gap: 6px 8px; } }
@media (max-width: 380px) { .pill { padding: 5px 8px; font-size: 15px; } .brand-mark { font-size: 24px; } }

/* ---------- screen ---------- */
.screen { max-width: 1160px; margin: 0 auto; padding-block: 20px 64px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.section-title { font-family: var(--f-display); font-weight: 400; font-size: clamp(24px, 3.6vw, 30px); letter-spacing: .02em; color: var(--manila); margin: 30px 0 12px; }
.section-title.dark { color: #2b1d10; margin: 0; }

/* paper */
.paper { color-scheme: light; background: var(--paper); color: var(--ink); border-radius: 6px 6px 12px 12px; padding: clamp(16px, 3vw, 28px); box-shadow: var(--shadow); position: relative; }
.paper h2 { font-family: var(--f-display); font-weight: 400; letter-spacing: .02em; margin: .2em 0 .4em; font-size: clamp(22px, 3.2vw, 28px); line-height: 1.1; }
.paper h2 small { font-family: var(--f-body); font-size: 15px; letter-spacing: 0; }
.paper .btn.ghost { color: var(--ink); }

/* avatar */
.avatar { position: relative; width: var(--s); height: var(--s); display: inline-grid; place-items: center; flex: none; }
.av-ring { position: absolute; inset: 0; border-radius: 50%; background: var(--coat); box-shadow: 0 4px 10px rgba(0,0,0,.35); }
.av-ring::after { content: ""; position: absolute; inset: 11%; border-radius: 50%; background: var(--white); box-shadow: inset 0 2px 6px rgba(0,0,0,.18); }
.av-face { position: relative; font-size: calc(var(--s) * .52); line-height: 1; }
.av-hat { position: absolute; top: calc(var(--s) * -.28); left: 50%; transform: translateX(-50%) rotate(-8deg); font-size: calc(var(--s) * .44); line-height: 1; filter: drop-shadow(0 2px 2px rgba(0,0,0,.35)); }

/* ---------- welcome ---------- */
.welcome-screen { min-height: 100vh; display: grid; place-items: center; }
.welcome { max-width: 580px; width: 100%; display: grid; gap: 12px; }
.welcome h1 { font-size: clamp(34px, 7vw, 50px); color: var(--ink); }
.lead { font-size: 19px; line-height: 1.6; }
.field-label { font-weight: 700; font-size: 16px; display: block; }
.text-input { font: inherit; font-size: 20px; min-height: 52px; padding: 10px 14px; border-radius: 12px; border: 3px solid var(--manila-2); background: #fff; color: var(--ink); width: 100%; }
.text-input:focus { border-color: var(--brass); outline: none; box-shadow: 0 0 0 3px rgba(127, 211, 255, .6); }
.animal-pick { display: flex; flex-wrap: wrap; gap: 8px; }
.animal { width: 56px; height: 56px; font-size: 32px; border-radius: 14px; border: 3px solid rgba(31,42,68,.12); background: #fff; cursor: pointer; display: grid; place-items: center; }
.animal.on { border-color: var(--brass); background: #fff1cf; transform: scale(1.06); }
.animal-pick.small .animal { width: 48px; height: 48px; font-size: 26px; }
.howto { text-align: left; display: grid; gap: 8px; padding: 0; margin: 14px 0; list-style: none; font-size: 18px; }
.howto li { display: flex; gap: 12px; align-items: center; background: var(--paper-2); border-radius: 10px; padding: 8px 12px; }
.howto span { font-size: 28px; }

/* ---------- map ---------- */
.hero { display: flex; gap: 20px; align-items: center; background: linear-gradient(135deg, var(--manila), #f4e2b5); color: var(--ink); border-radius: 16px; padding: 22px 20px 18px; box-shadow: var(--shadow); border-left: 10px solid var(--brass); }
.hero-info { min-width: 0; flex: 1; }
.hero-name { font-size: clamp(28px, 5vw, 42px); color: var(--ink); }
.hero-av { padding-top: 14px; }
.rank { display: grid; gap: 4px; max-width: 420px; }
.rank-name { font-weight: 700; font-size: 18px; }
.bar { height: 12px; border-radius: 999px; background: rgba(31,42,68,.15); overflow: hidden; }
.bar span { display: block; height: 100%; background: linear-gradient(90deg, var(--clue), #46c1af); border-radius: inherit; }
.folders { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 20px 18px; }
.folder { position: relative; text-align: left; padding: 24px 0 0; background: none; border: 0; cursor: pointer; color: var(--ink); }
.folder-tab { position: absolute; top: 0; left: 14px; background: var(--manila-2); padding: 4px 14px 8px; border-radius: 10px 10px 0 0; font-family: var(--f-type); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; }
.folder-body { display: grid; gap: 6px; background: linear-gradient(170deg, var(--manila), var(--manila-2)); border-radius: 4px 12px 12px 12px; padding: 18px; min-height: 160px; box-shadow: var(--shadow); transition: transform .15s; }
@media (hover: hover) { .folder:hover .folder-body { transform: translateY(-3px) rotate(-.4deg); } }
.folder:focus-visible .folder-body { transform: translateY(-3px) rotate(-.4deg); }
.folder-icon { font-size: 44px; line-height: 1.1; }
.folder-title { font-family: var(--f-display); font-size: 22px; line-height: 1.1; letter-spacing: .02em; }
.folder-meta { display: flex; flex-wrap: wrap; gap: 6px 10px; font-size: 15px; color: var(--muted-ink); align-items: center; }
.lvl { background: rgba(31,42,68,.12); border-radius: 999px; padding: 1px 9px; font-weight: 700; color: var(--ink); }
.folder.locked .folder-body { filter: grayscale(.6) brightness(.72); }
.folder.locked { cursor: not-allowed; }
.stamp { font-family: var(--f-display); text-transform: uppercase; letter-spacing: .05em; color: var(--stamp); border: 4px solid currentColor; border-radius: 8px; padding: 2px 10px; display: inline-block; transform: rotate(-8deg); line-height: 1.2; }
.folder-stamp { position: absolute; right: 14px; top: 44px; transform: rotate(12deg); font-size: 20px; background: rgba(251,245,230,.4); }
.cork { margin-top: 34px; background:
    radial-gradient(circle at 20% 30%, rgba(0,0,0,.08) 0 2px, transparent 3px) 0 0 / 23px 19px,
    radial-gradient(circle at 70% 60%, rgba(255,255,255,.08) 0 1.5px, transparent 2.5px) 0 0 / 17px 21px,
    var(--cork);
  border: 12px solid var(--cork-frame); border-radius: 12px; padding: 18px; box-shadow: inset 0 0 30px rgba(0,0,0,.35), var(--shadow); color: #2b1d10; }
.cork-head { display: grid; gap: 4px; margin-bottom: 14px; }
.cork-head p { margin: 0; font-size: 17px; max-width: 60ch; }
.notes { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 160px), 1fr)); gap: 16px; }
.note { background: #fffbe9; color: var(--ink); padding: 24px 12px 12px; min-height: 130px; transform: rotate(var(--r, -2deg)); box-shadow: 0 6px 12px rgba(0,0,0,.3); position: relative; }
.note.empty { background: rgba(255,251,233,.32); display: grid; place-items: center; box-shadow: none; outline: 2px dashed rgba(43,29,16,.3); }
.note .q { font-family: var(--f-display); font-size: 48px; color: rgba(43,29,16,.35); }
.pin { position: absolute; top: 6px; left: 50%; margin-left: -8px; width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ff9aa1, var(--stamp) 60%); box-shadow: 0 2px 3px rgba(0,0,0,.45); }
.note-text { font-family: var(--f-type); font-size: 16px; margin: 0 0 6px; }
.note-clue { font-size: 14px; color: var(--clue-ink); font-weight: 700; margin: 0; }
.note-from { font-size: 12px; color: var(--muted-ink); display: block; margin-top: 6px; }
.quick { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 14px; margin-top: 30px; }
.quick-card { background: var(--desk-2); color: var(--on-desk); border-radius: 16px; padding: 16px; display: grid; gap: 2px; text-align: left; border: 1px solid rgba(255,255,255,.08); cursor: pointer; min-height: 44px; }
.quick-card span { font-size: 32px; }
.quick-card b { font-family: var(--f-display); font-weight: 400; font-size: 21px; letter-spacing: .03em; color: var(--manila); }
.quick-card small { color: var(--on-desk-muted); font-size: 15px; }

/* ---------- case ---------- */
.case-head { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 14px; margin-bottom: 18px; }
.back { flex: none; }
.case-title { display: flex; align-items: center; gap: 12px; flex: 1 1 260px; min-width: 0; }
.case-title h1 { font-family: var(--f-display); font-weight: 400; letter-spacing: .02em; font-size: clamp(22px, 3.6vw, 32px); margin: 0; color: var(--manila); line-height: 1.05; }
.case-icon { font-size: 40px; }
.case-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.sdots { display: flex; gap: 6px; }
.sdot { width: 36px; height: 36px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25); display: grid; place-items: center; font-family: var(--f-display); font-size: 19px; color: var(--on-desk-muted); }
.sdot.cur { border-color: var(--brass); color: var(--brass); box-shadow: 0 0 0 4px rgba(217,164,65,.2); }
.sdot.done { background: var(--clue); border-color: var(--clue); color: #fff; }
.case-grid { display: grid; grid-template-columns: minmax(0, 1fr) 310px; gap: 22px; align-items: start; }
.case-grid.focus { grid-template-columns: minmax(0, 1fr); }
.case-grid.focus .board { display: none; }
.stage { min-width: 0; display: grid; gap: 16px; }
@media (max-width: 920px) { .case-grid { grid-template-columns: minmax(0, 1fr); } }

.story-card { display: grid; gap: 4px; }
.case-intro { background: var(--paper-2); border-radius: 10px; padding: 14px 16px; }
.torn { border: 0; height: 14px; margin: 14px 0 6px; background: radial-gradient(circle at 7px -2px, transparent 8px, rgba(31,42,68,.14) 8.5px, transparent 9.5px) 0 0 / 14px 14px repeat-x; }
.scene-title { font-family: var(--f-display); font-weight: 400; font-size: clamp(28px, 4.5vw, 38px); letter-spacing: .02em; line-height: 1.05; margin: .15em 0 .3em; }
.story-text { font-size: clamp(18px, 2.3vw, 20px); line-height: 1.68; max-width: 64ch; margin: 0; }
.witness { display: flex; gap: 12px; align-items: flex-start; background: linear-gradient(170deg, var(--manila), #efd9a6); border-radius: 12px; padding: 14px 16px; margin: 18px 0 6px; }
.witness-e { font-size: 46px; line-height: 1; }
.witness blockquote { margin: 0; flex: 1; min-width: 0; }
.witness p { margin: 0 0 4px; font-size: 19px; line-height: 1.55; }
.witness figcaption { font-family: var(--f-type); font-size: 13px; letter-spacing: .06em; color: #6b5427; }
.stage-actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 10px; margin-top: 14px; }

.scan-card { display: grid; gap: 12px; }
.scan-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
.scan-head h2 { font-family: var(--f-display); font-weight: 400; color: var(--manila); font-size: clamp(22px, 3.4vw, 30px); margin: 2px 0 0; letter-spacing: .02em; line-height: 1.1; }
.bonus-count { background: rgba(255,255,255,.09); border-radius: 999px; padding: 6px 12px; font-size: 15px; }
.scan-tip { margin: 0; background: rgba(255,255,255,.07); border-radius: 10px; padding: 9px 14px; font-size: 17px; }
.scan-wrap { border-radius: 16px; overflow: hidden; border: 4px solid #0b1119; box-shadow: var(--shadow); line-height: 0; background: #03070f; }
#scanner { display: block; width: 100%; touch-action: none; cursor: none; }
#scanner:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; }
.found { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: center; animation: popIn .45s ease-out both; }
.found-e { font-size: 58px; line-height: 1; }
.found .btn { grid-column: 1 / -1; justify-self: end; }
.problem { font-size: clamp(19px, 2.5vw, 22px); font-weight: 700; line-height: 1.5; margin: .3em 0; }
.clue-card { border-left: 8px solid var(--brass); }
.after-solve { display: grid; gap: 10px; justify-items: start; animation: popIn .4s ease-out both; }
.felix-line { font-size: 18px; margin: 0; }

/* ---------- the safe ---------- */
.safe { position: relative; max-width: 620px; background: linear-gradient(160deg, var(--steel), var(--steel-2)); border-radius: 22px; border: 3px solid #20262e; padding: 14px;
  box-shadow: inset 0 2px 0 rgba(255,255,255,.16), inset 0 -5px 0 rgba(0,0,0,.3), var(--shadow); color: var(--on-desk); perspective: 900px; }
.safe::before { content: ""; position: absolute; inset: 7px; pointer-events: none; border-radius: 16px;
  background: radial-gradient(circle at 6px 6px, #8d98a5 3px, transparent 4px), radial-gradient(circle at calc(100% - 6px) 6px, #8d98a5 3px, transparent 4px),
    radial-gradient(circle at 6px calc(100% - 6px), #8d98a5 3px, transparent 4px), radial-gradient(circle at calc(100% - 6px) calc(100% - 6px), #8d98a5 3px, transparent 4px); }
.safe-plate { display: flex; justify-content: space-between; align-items: center; margin: 2px 6px 10px; }
.safe-label { font-family: var(--f-type); font-size: 13px; letter-spacing: .1em; background: linear-gradient(#f0cf7c, var(--brass)); color: var(--ink); padding: 3px 10px; border-radius: 4px; box-shadow: inset 0 -2px 0 rgba(0,0,0,.2); }
.safe-lock { font-size: 22px; }
.safe-face { background: var(--steel-face); border-radius: 14px; padding: 14px 10px; display: flex; flex-direction: column; align-items: center; overflow-x: auto; box-shadow: inset 0 4px 10px rgba(0,0,0,.5); }
.colgrid { --cw: clamp(48px, 14vw, 62px); display: grid; grid-template-columns: repeat(var(--n), var(--cw)); justify-content: center; row-gap: 4px; }
.cg-row { display: contents; }
.cg-cell { display: flex; align-items: center; justify-content: center; min-height: 44px; position: relative; }
.cg-rule { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--brass); margin: 4px 0; }
.cg-sign { font-family: var(--f-display); color: var(--brass); font-size: 36px; }
.digit { font-family: var(--f-display); font-size: clamp(30px, 7.5vw, 42px); color: var(--paper); line-height: 1; min-width: 44px; min-height: 48px; display: inline-flex; align-items: center; justify-content: center; position: relative; background: none; border: 0; padding: 0 2px; }
.digit .was { position: absolute; top: -6px; left: -4px; font-size: 18px; color: var(--on-desk-muted); text-decoration: line-through; text-decoration-color: var(--stamp-bright); text-decoration-thickness: 2px; }
.digit .now { color: var(--brass); }
.digit.lendable { cursor: pointer; border-bottom: 3px dashed rgba(217,164,65,.65); border-radius: 6px; }
@media (hover: hover) { .digit.lendable:hover { background: rgba(217,164,65,.15); } }
.gear-slot { width: 42px; height: 42px; border-radius: 50%; border: 2px dashed var(--brass); background: rgba(217,164,65,.08); cursor: pointer; display: grid; place-items: center; font-size: 22px; padding: 0; }
.gear-slot.on { background: var(--brass); border-style: solid; animation: spinIn .35s ease-out; }
.gear-ghost { color: rgba(217,164,65,.55); font-size: 24px; }
.gear-fixed { font-size: 24px; }
.wheel { width: calc(var(--cw, 56px) - 6px); height: 64px; border-radius: 12px; border: 3px solid #8a6420; display: grid; place-items: center;
  background: linear-gradient(#fff9e8, var(--manila) 55%, #cfae6a); color: var(--ink); font-family: var(--f-display); font-size: 38px; line-height: 1;
  box-shadow: inset 0 -7px 0 rgba(0,0,0,.13), inset 0 6px 0 rgba(255,255,255,.55); }
.wheel.idle { opacity: .45; }
.wheel.active { border-color: var(--brass); box-shadow: inset 0 -7px 0 rgba(0,0,0,.13), 0 0 0 5px rgba(217,164,65,.35); animation: glow 1.6s ease-in-out infinite; }
.wheel.done { background: linear-gradient(#ecfffa, #a7e3d6); border-color: var(--clue-ink); }
.free-eq { font-family: var(--f-display); color: var(--brass); font-size: clamp(28px, 7vw, 38px); letter-spacing: .03em; margin-bottom: 10px; }
.free-wheels { --cw: 60px; display: flex; gap: 8px; justify-content: center; }
.coach { display: flex; gap: 10px; align-items: center; border-left: 5px solid var(--on-desk-muted); background: rgba(255,255,255,.06); border-radius: 10px; padding: 8px 10px 8px 12px; margin-top: 12px; font-size: 17px; line-height: 1.45; }
.coach > span:nth-child(2) { flex: 1; min-width: 0; }
.coach-e { font-size: 24px; }
.coach.miss { border-color: var(--stamp-bright); background: rgba(200,50,60,.16); }
.coach.remind { border-color: var(--brass); background: rgba(217,164,65,.15); }
.coach.ok { border-color: var(--clue); background: rgba(47,158,143,.18); }
.paper .coach { color: var(--ink); }
.paper .coach.miss { background: #fde4e2; }
.choices { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; }
.choices-label { font-weight: 700; }
.choices .chip { font-family: var(--f-display); font-size: 24px; min-width: 64px; background: var(--paper); color: var(--ink); border-color: var(--brass); }
.keypad { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
.key { min-height: 54px; font-family: var(--f-display); font-size: 27px; background: #e8eef7; color: var(--ink); border-radius: 12px; border: 0; cursor: pointer; box-shadow: inset 0 -4px 0 rgba(0,0,0,.2); }
.key:active { transform: translateY(2px); box-shadow: inset 0 -2px 0 rgba(0,0,0,.2); }
.key.ghost { background: #3b4c63; color: var(--on-desk); font-family: var(--f-body); font-weight: 700; font-size: 17px; }
.key[disabled] { opacity: .45; cursor: default; }
.key-actions { display: flex; gap: 8px; margin-top: 8px; }
.key-actions .key.wide { flex: 0 0 auto; padding: 0 16px; }
.key-actions .btn.go { flex: 1; font-family: var(--f-display); font-weight: 400; font-size: 22px; letter-spacing: .03em; min-height: 56px; }
.safe-tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
.hint-panel { background: var(--paper); color: var(--ink); border-radius: 12px; padding: 12px 14px; margin-top: 10px; animation: popIn .3s ease-out both; }
.hint-panel p { margin: 4px 0; font-size: 17px; }
.hint-title { font-weight: 700; }
.blocks { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 6px 0; }
.bgrp { display: inline-flex; flex-wrap: wrap; gap: 3px; max-width: 120px; }
.blk { width: 16px; height: 16px; border-radius: 3px; display: inline-block; }
.blk.a { background: var(--brass); } .blk.b { background: var(--clue); } .blk.g { background: #8d98a5; }
.blk.x { background: linear-gradient(45deg, transparent 45%, var(--stamp) 45% 55%, transparent 55%), #e3d7bd; }
.safe.open { overflow: hidden; }
.door { position: absolute; inset: 0; border-radius: 20px; background: linear-gradient(160deg, var(--steel), var(--steel-2)); transform-origin: left center; animation: doorOpen 1s ease-in .1s forwards; z-index: 2; }
.door::after { content: "🔒"; position: absolute; right: 18px; top: 50%; transform: translateY(-50%); font-size: 30px; }
.safe-inside { text-align: center; padding: 28px 16px; border-radius: 14px; background: radial-gradient(circle at 50% 40%, #5a4417, #221a0d 75%); display: grid; gap: 10px; justify-items: center; }
.stamp.cracked { font-size: clamp(32px, 8vw, 46px); color: var(--stamp-bright); animation: stampIn .5s cubic-bezier(.2, 1.6, .5, 1) .7s both; }
.cracked-ans { font-family: var(--f-display); font-size: clamp(22px, 5vw, 30px); color: var(--manila); letter-spacing: .03em; }
.cracked-ans b { color: #fff; }
.stars-pop { font-family: var(--f-display); font-size: 28px; color: var(--brass); animation: popIn .5s ease-out 1.1s both; }

/* models */
.model { max-width: 620px; background: var(--desk-2); border-radius: 16px; padding: 14px; margin-top: 14px; border: 1px solid rgba(255,255,255,.08); display: grid; gap: 10px; }
.model-head { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.model-head span { color: var(--on-desk-muted); font-size: 15px; }
.pile { display: flex; flex-wrap: wrap; gap: 4px; min-height: 48px; padding: 8px; background: rgba(0,0,0,.22); border-radius: 10px; align-items: center; }
.tk { font-size: 21px; line-height: 1; display: inline-block; }
.tk.pack { display: inline-grid; place-items: center; width: 32px; height: 22px; background: var(--clue); color: #fff; font: 700 12px/1 var(--f-body); border-radius: 5px; box-shadow: inset 0 -2px 0 rgba(0,0,0,.25); }
.tk.bag { display: inline-grid; place-items: center; width: 40px; height: 26px; background: var(--brass); color: var(--ink); font: 700 12px/1 var(--f-body); border-radius: 12px 12px 6px 6px; box-shadow: inset 0 -2px 0 rgba(0,0,0,.2); }
.tray-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 8px; }
.tray { min-height: 76px; background: linear-gradient(#8a6a45, #6e5233); border-radius: 12px; border: 3px solid #4f3a22; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 3px; padding: 6px; cursor: pointer; }
.tray:active { transform: translateY(2px); }
.model-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.model-msg { font-weight: 700; color: var(--manila); }
.model-msg.good { color: var(--clue-bright); }
.steppers { display: flex; flex-wrap: wrap; gap: 10px; }
.stepper { display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,.22); border-radius: 999px; padding: 4px 6px 4px 14px; }

.treehouse { position: relative; width: 100%; aspect-ratio: 16 / 9; min-height: 280px; border-radius: 18px; overflow: hidden; border: 8px solid var(--wood); box-shadow: var(--shadow);
  background: linear-gradient(#6e4a29, #5b3d22) bottom / 100% 24% no-repeat, repeating-linear-gradient(90deg, #a77c4f 0 46px, #94703f 46px 48px); }

  background: radial-gradient(circle at 30% 30%, #fff 0 2px, transparent 3px), radial-gradient(circle at 70% 60%, #fff 0 1.5px, transparent 2.5px), radial-gradient(circle at 55% 25%, #ffe9a8 0 1.5px, transparent 2.5px), linear-gradient(#0b1026, #24204a); }

@media (max-width: 820px) { .hq-grid { grid-template-columns: minmax(0, 1fr); } }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 140px), 1fr)); gap: 10px; }

.ladder { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }

.stats { display: grid; gap: 4px; margin: 0; }
.stats div { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px dashed rgba(31,42,68,.18); padding: 4px 0; }
.stats dt { color: var(--muted-ink); }
.stats dd { margin: 0; font-weight: 700; }

/* parent */
.parent fieldset { border: 2px solid rgba(31,42,68,.15); border-radius: 12px; padding: 12px; margin: 0 0 12px; display: grid; gap: 8px; }
.parent legend { font-family: var(--f-type); text-transform: uppercase; letter-spacing: .1em; font-size: 13px; padding: 0 6px; }
.radio, .chk { display: flex; gap: 10px; align-items: flex-start; padding: 6px 8px; border-radius: 10px; cursor: pointer; min-height: 44px; }
@media (hover: hover) { .radio:hover, .chk:hover { background: var(--paper-2); } }
.radio input, .chk input { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--brass-2); flex: none; }
.radio small { display: block; color: var(--muted-ink); font-size: 14px; }
.parent input[type=range] { width: 100%; accent-color: var(--brass-2); min-height: 32px; }
.parent .btn.small.ghost { justify-self: start; }
.danger { margin-top: 4px; display: grid; gap: 8px; }

/* ---------- motion ---------- */
@keyframes popIn { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: none; } }

@keyframes flipIn { from { transform: rotateX(90deg); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes doorOpen { 0% { transform: rotateY(0); } 100% { transform: rotateY(-105deg); opacity: 0; } }
@keyframes glow { 50% { box-shadow: inset 0 -7px 0 rgba(0,0,0,.13), 0 0 0 8px rgba(217,164,65,.18); } }
@keyframes spinIn { from { transform: rotate(-180deg) scale(.5); } to { transform: none; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; animation-delay: 0ms !important; }

}
@media (max-width: 520px) {
  body { font-size: 17px; }

  .stage-actions .btn.big, .found .btn { width: 100%; }
  .shop-head { gap: 14px; }
  .shop-preview { padding: 24px 12px 10px; }
}

<script>
"use strict";
/* ============================================================
   STARLIGHT DETECTIVE AGENCY: content
   Stories never contain numbers; problems use {a} {b} {N} {d}.
   ============================================================ */

const SUSPECTS = {
  barnaby: { e: '🦡', name: 'Barnaby Badger', short: 'Barnaby', desc: 'Grumpy pie baker',
    catch: 'Hmph! I was busy baking!', cleared: 'Hmph. Told you so.',
    voice: { pitch: 0.55, rate: 0.9 } },
  penelope: { e: '🦚', name: 'Penelope Peacock', short: 'Penelope', desc: 'Fabulous show-off',
    catch: 'Darling, do I LOOK like a thief?', cleared: 'Naturally, darling. I am far too fabulous for crime.',
    voice: { pitch: 1.6, rate: 1.0 } },
  viktor: { e: '🐹', name: 'Viktor Vole', short: 'Viktor', desc: 'Nervous gadget inventor',
    catch: 'I-I-I was just testing my gadgets!', cleared: 'Ph-phew! I knew my alibi would hold up!',
    voice: { pitch: 1.4, rate: 1.15 } },

    catch: 'Hoo, me? I was reading by moonlight.', cleared: 'Hoo. As I said. Reading.',
    voice: { pitch: 0.85, rate: 0.85 } },
};
const SUSPECT_IDS = ['barnaby', 'penelope', 'viktor', 'maxima'];

const FELIX = { e: '🦊', name: 'Inspector Felix', voice: { pitch: 1.15, rate: 1 } };
const REMAINDER = { e: '🦝', name: 'Professor Remainder', voice: { pitch: 0.75, rate: 1.05 } };

const THEMES = {
  museum:      { sky: ['#2b2140', '#463a5c'], floor: '#5b4a3a', props: ['🏺', '🗿', '🦴', '🖼️', '🪔', '🏛️'] },
  bakery:      { sky: ['#3a2a22', '#5e4232'], floor: '#7a5a3c', props: ['🥖', '🧁', '🍪', '🥐', '🫖', '🍩'] },
  clock:       { sky: ['#1f2a3d', '#34465f'], floor: '#4a3b2c', props: ['⏰', '🔧', '🪛', '🕯️', '🔩', '🪜'] },
  aquarium:    { sky: ['#0c2a40', '#145a6e'], floor: '#c9b48a', props: ['🪸', '⚓', '🪼', '🦑', '🐠', '🧜'] },
  train:       { sky: ['#1d2333', '#3a3148'], floor: '#5a3d2e', props: ['🧳', '🛤️', '🪑', '🧺', '🎩', '🕰️'] },
  observatory: { sky: ['#0b1026', '#24204a'], floor: '#3a3a52', props: ['🔭', '🌙', '🪐', '☄️', '📡', '🗺️'] },
};

/* op: add | sub | mul | div */
const CASES = [
  /* ---------------- CASE 1 ---------------- */
  {
    id: 'compass', title: 'The Missing Starlight Compass', icon: '🧭', theme: 'museum',
    treasure: 'the Starlight Compass', culprit: 'barnaby',
    intro: 'Starlight Town Museum has a treasure that glows like a tiny moon: the Starlight Compass. Sailors say it always points the way home. But this morning, its glass case was empty! All that was left on the velvet pillow was a sticky purple smudge. The museum guard is wringing his paws. Inspector Felix tips his hat to you. "Detective, the whole town is counting on us. Let\'s find that compass before the moon comes up!"',
    scenes: [
      { op: 'div', title: 'Muddy Stepping Stones', place: 'The Museum Garden',
        witness: { e: '🐸', name: 'Ribbit the Gardener', voice: { pitch: 0.9, rate: 1.05 },
          quote: 'Ribbit! I heard splashing at midnight. Somebody was in a big rush, and they did NOT wipe their feet!' },
        story: 'Behind the museum is a quiet garden with a lily pond. A path of flat stepping stones crosses the water. Ribbit the Gardener hops over to meet you, pointing with a dripping lily pad. Last night, someone ran across those stones in a big hurry, and they left muddy paw prints everywhere! Earlier today, Felix had all four suspects hop across the stones, so he knows exactly how each one steps. "If we work out how many prints are on each stone," Felix says, "we\'ll know whose feet made them. Grab your flashlight!"',
        evidence: { e: '🐾', label: 'muddy paw prints' }, token: '🐾',
        problem: 'The thief left {N} muddy paw prints, spread evenly over {d} stepping stones. How many prints are on each stone?',
        cat: { e: '🐾', label: 'Prints per stone' }, out: ['viktor'] },
      { op: 'mul', title: 'The Map Crates', place: 'The Museum Storeroom',
        witness: { e: '🦔', name: 'Hazel the Hedgehog', voice: { pitch: 1.3, rate: 1.1 },
          quote: 'My crates! I stacked them so neatly. Every single map was in perfect order, and now look at this mess!' },
        story: 'Down in the museum storeroom, wooden crates line the walls. Each crate holds rolled-up star-maps, tied with silver string. Hazel the Hedgehog keeps the storeroom tidy, and right now she is NOT happy. Some of her crates have been tipped over and emptied! Whoever took the compass wanted the maps too, so they could find their way in the dark. Felix taps his chin. "Every suspect carries a satchel. If we count the maps that were taken, we can find out whose satchel is stuffed full."',
        evidence: { e: '🗺️', label: 'an empty map crate' }, token: '🗺️',
        problem: 'The thief emptied {a} crates. Each crate held {b} star-maps. How many maps are in the thief\'s satchel?',
        cat: { e: '🎒', label: 'Maps in satchel' }, out: ['penelope'] },
      { op: 'add', title: 'The Dropped Pedometer', place: 'The Secret Tunnel',
        witness: { e: '🦇', name: 'Echo the Bat', voice: { pitch: 1.5, rate: 1.15 },
          quote: 'Eeek! Something shiny fell right under my roost. Bats notice everything shiny. And everything squeaky.' },
        story: 'A secret tunnel runs under the museum, from the Hall of Stars all the way to the harbor. Echo the Bat hangs near the tunnel ceiling, and she spotted something shiny on the floor: a pedometer! A pedometer is a little gadget that counts every step you take. Last night, the museum gave a pedometer to every guest, and the guard wrote down everyone\'s total. The thief must have dropped this one while running. Its screen is cracked, but the numbers still glow. "Add up these steps," says Felix, "and see whose total matches."',

/* ============================================================
   Problem generator, decoys, mistake diagnosis (pure functions)
   ============================================================ */

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function makeRng(...parts) { return mulberry32(hashStr(parts.join('|'))); }
function ri(rng, lo, hi) { return lo + Math.floor(rng() * (hi - lo + 1)); }
function pick(rng, arr) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(rng, arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function fmt(n) { return Number(n).toLocaleString('en-US'); }
function digitAt(n, place) { return Math.floor(n / Math.pow(10, place)) % 10; }

function countCarries(a, b) {
  let c = 0, carry = 0;
  while (a > 0 || b > 0) {
    const s = (a % 10) + (b % 10) + carry;
    carry = s >= 10 ? 1 : 0; c += carry;
    a = Math.floor(a / 10); b = Math.floor(b / 10);
  }
  return c;
}
function countBorrows(a, b) {
  let c = 0, br = 0;
  while (a > 0 || b > 0) {
    const t = (a % 10) - br, bb = b % 10;
    if (t < bb) { c++; br = 1; } else br = 0;
    a = Math.floor(a / 10); b = Math.floor(b / 10);
  }
  return c;
}
/* true when some column must borrow from a neighbour whose digit is 0 */
function borrowsAcrossZero(a, b) {
  let br = 0;
  const len = String(a).length;
  for (let i = 0; i < len; i++) {
    const t = digitAt(a, i) - br, bb = digitAt(b, i);
    if (t < bb) { if (i + 1 < len && digitAt(a, i + 1) === 0) return true; br = 1; } else br = 0;
  }
  return false;
}
function noCarrySum(a, b) {
  let r = 0, p = 1;
  while (a > 0 || b > 0) { r += (((a % 10) + (b % 10)) % 10) * p; p *= 10; a = Math.floor(a / 10); b = Math.floor(b / 10); }
  return r;
}
function smallerFromLarger(a, b) {
  let r = 0, p = 1;
  while (a > 0 || b > 0) { r += Math.abs((a % 10) - (b % 10)) * p; p *= 10; a = Math.floor(a / 10); b = Math.floor(b / 10); }
  return r;
}

const FREE_WHEELS = { mul: [2, 3, 4], div: [2, 2, 3] };

function genProblem(op, level, rng) {
  level = Math.max(1, Math.min(3, Number(level) || 1));
  let p = { op, level };
  let guard = 0;
  if (op === 'add') {
    let a, b;
    do {
      if (level === 1) { a = ri(rng, 120, 780); b = ri(rng, 110, 999 - a); }
      else if (level === 2) { a = ri(rng, 1200, 6800); b = ri(rng, 300, Math.min(3900, 9999 - a)); }
      else { a = ri(rng, 2100, 7400); b = ri(rng, 800, Math.min(2900, 9999 - a)); }
    } while (countCarries(a, b) < (level === 3 ? 2 : 1) && ++guard < 500);
    Object.assign(p, { a, b, ans: a + b, mode: 'column' });
  } else if (op === 'sub') {
    let a, b;
    do {
      if (level === 1) { a = ri(rng, 300, 999); b = ri(rng, 101, a - 100); }
      else if (level === 2) { a = ri(rng, 2000, 9999); b = ri(rng, 200, a - 1000); }
      else {
        a = ri(rng, 2000, 9999);
        const zeroPlace = rng() < 0.5 ? 1 : 2;
        a = a - digitAt(a, zeroPlace) * Math.pow(10, zeroPlace);
        b = ri(rng, 200, a - 1000);
      }
    } while ((countBorrows(a, b) < 1 || (level === 3 && !borrowsAcrossZero(a, b)) || a - b < (level === 1 ? 100 : 1000)) && ++guard < 2000);
    Object.assign(p, { a, b, ans: a - b, mode: 'column' });
  } else if (op === 'mul') {
    const unit = [1, 10, 100][level - 1];
    const a = ri(rng, 2, 9), k = ri(rng, 2, 9), b = k * unit;
    Object.assign(p, { a, b, k, unit, ans: a * b, mode: 'free', wheels: FREE_WHEELS.mul[level - 1] });
  } else {
    const unit = [1, 10, 100][level - 1];
    const d = ri(rng, 2, 9), qq = level === 1 ? ri(rng, 2, 10) : ri(rng, 2, 9);
    Object.assign(p, { d, qq, unit, N: d * qq * unit, ans: qq * unit, mode: 'free', wheels: FREE_WHEELS.div[level - 1] });
  }
  if (p.mode === 'column') p.wheels = Math.max(String(p.a).length, String(p.ans).length);
  p.decoys = makeDecoys(p);
  return p;
}

function makeDecoys(p) {
  const { op, ans } = p;
  let cands;
  if (op === 'add') cands = [noCarrySum(p.a, p.b), ans + 100, ans - 100, ans + 10, ans - 10, ans + 1000, ans - 1000, ans + 1];
  else if (op === 'sub') cands = [smallerFromLarger(p.a, p.b), ans + 100, ans - 100, ans + 10, ans - 10, ans + 1000, ans + 1];
  else if (op === 'mul') cands = [ans + p.b, ans - p.b, ans + 2 * p.b, ans - 2 * p.b, ans + 3 * p.b];
  else cands = [(p.qq + 1) * p.unit, (p.qq - 1) * p.unit, (p.qq + 2) * p.unit, (p.qq - 2) * p.unit, (p.qq + 3) * p.unit];
  const out = [];
  for (const c of cands) if (c > 0 && c !== ans && !out.includes(c)) { out.push(c); if (out.length === 3) break; }
  return out;
}

function fillText(tpl, p) {
  return tpl.replace(/\{a\}/g, fmt(p.a)).replace(/\{b\}/g, fmt(p.b)).replace(/\{N\}/g, fmt(p.N)).replace(/\{d\}/g, fmt(p.d));
}
function equationText(p) {
  const s = OP_SYMBOL[p.op];
  if (p.op === 'div') return `${fmt(p.N)} ${s} ${p.d}`;
  return `${fmt(p.a)} ${s} ${fmt(p.b)}`;
}

/* ---------- column checks (+ / −) ---------- */
function checkAddColumn({ t, b, cin, given, gearPlaced }) {
  const s = t + b + cin, digit = s % 10, needGear = s >= 10;
  const sumTxt = `${t} + ${b}${cin ? ' + 1' : ''} = ${s}`;
  if (given === digit) {
    if (needGear && !gearPlaced) return { status: 'remind', msg: `Right digit! But ${sumTxt}. That's 10 or more, so the extra ten needs a carry gear ⚙️. Tap the gear spot above the next column.` };
    if (!needGear && gearPlaced) return { status: 'remind', msg: `Right digit! But ${sumTxt}, which is less than 10. No carry gear needed here. Tap the gear to take it off.` };
    return { status: 'ok', carried: needGear };
  }
  if (cin && given === (t + b) % 10) return { status: 'miss', msg: `So close! Don't forget the carry gear ⚙️ sitting on top of this column. It adds 1 more.` };
  if (t !== b && given === Math.abs(t - b)) return { status: 'miss', msg: `Hmm, that looks like take-away. This safe has a plus sign. Put the numbers together!` };
  return { status: 'miss', msg: `Add ${t} + ${b}${cin ? ' + 1 for the gear' : ''}. If you get 10 or more, write only the ones digit and carry the ten.` };
}

function checkSubColumn({ T, B, received, given }) {
  if (received && T - 10 >= B) return { status: 'remind', msg: `You borrowed here, but ${T - 10} is already big enough to take away ${B}. Tap Undo ↩ to give the 1 back.` };
  if (T < B) {
    if (given === B - T) return { status: 'miss', msg: `Careful! You can't take ${B} away from ${T}, because ${T} is smaller. Borrow first: tap the top number in the column to the left.` };
    if (given === T + 10 - B) return { status: 'remind', msg: `That's the right number! But show your borrow first. Tap the top number to the left so it can lend 1.` };
    if (given === (T + B) % 10) return { status: 'miss', msg: `Hmm, that looks like adding. This safe has a minus sign, so take away!` };
    return { status: 'miss', msg: `Can you take ${B} away from ${T}? ${T} is smaller than ${B}, so you need to borrow first!` };
  }
  const d = T - B;
  if (given === d) return { status: 'ok', borrowed: received };
  if (B !== 0 && given === (T + B) % 10) return { status: 'miss', msg: `Hmm, that looks like adding. This safe has a minus sign, so take away!` };
  return { status: 'miss', msg: `Take ${B} away from ${T}. Try counting back ${B} from ${T}.` };
}

/* ---------- free checks (× / ÷) ---------- */
function checkMul(p, given) {
  const { a, b, k, unit, ans } = p;
  if (given === ans) return { status: 'ok' };
  if (given === a + b) return { status: 'miss', msg: `That's ${a} + ${fmt(b)}, which is adding! Multiplying means ${a} groups of ${fmt(b)}. Try building the crates below.` };
  if (unit > 1 && given === a * k) return { status: 'miss', msg: `You found ${a} × ${k} = ${a * k}. Nice fact! But each crate holds ${fmt(b)}, not ${k}. Put the zero${unit === 100 ? 's' : ''} back on the end.` };
  if (given === ans + b || given === ans - b) return { status: 'miss', msg: `So close! That's one crate ${given > ans ? 'too many' : 'too few'}. There are ${a} crates. Count them again.` };
  if (unit > 1 && (given === ans * 10 || given * 10 === ans)) return { status: 'miss', msg: `Check your zeros! ${a} × ${k} = ${a * k}. Each crate has ${fmt(b)}, so how many zeros go on the end?` };
  return { status: 'miss', msg: `Not quite. Try skip counting by ${fmt(b)}, ${a} times: ${fmt(b)}, ${fmt(2 * b)}, ${fmt(3 * b)}...` };
}

function checkDiv(p, given) {
  const { N, d, qq, unit, ans } = p;
  if (given === ans) return { status: 'ok' };
  if (unit > 1 && given === qq) return { status: 'miss', msg: `${qq} what? Each group gets ${qq} ${unit === 10 ? 'packs of 10' : 'bags of 100'}. How many is that altogether?` };
  if (given === N - d) return { status: 'miss', msg: `That's ${fmt(N)} take away ${d}. Dividing means sharing ${fmt(N)} into ${d} equal groups.` };
  if (given >= N) return { status: 'miss', msg: `Whoa, that's as much as the whole pile! Sharing makes each group smaller than the pile we started with.` };
  const prod = d * given;
  return { status: 'miss', msg: `Let's check: ${d} × ${fmt(given)} = ${fmt(prod)}. Is that ${fmt(N)}? ${prod > N ? 'Too many!' : 'Not enough yet!'} Try the trays below.` };
}

function freeChoices(p, rng) {
  const opts = [p.ans];
  const pool = p.op === 'mul' ? [p.ans + p.b, p.ans - p.b, p.ans + 2 * p.b] : [p.ans + p.unit, p.ans - p.unit, p.ans + 2 * p.unit];
  for (const c of pool) if (c > 0 && !opts.includes(c) && opts.length < 3) opts.push(c);
  return shuffle(rng, opts);
}

    .replace(/÷/g, ' divided by ').replace(/×/g, ' times ').replace(/−/g, ' minus ')

  try {
    const vs = speechSynthesis.getVoices().filter(v => /^en[-_]/i.test(v.lang));
    if (!vs.length) return null;
    const prefer = ['Samantha', 'Karen', 'Daniel', 'Moira', 'Tessa', 'Google US English', 'Microsoft Aria', 'Microsoft Jenny'];
    VOICE = prefer.map(n => vs.find(v => v.name.startsWith(n))).find(Boolean)

  const colors = ['#d9a441', '#c8323c', '#2f9e8f', '#e9cf94', '#7aa7ff', '#ffffff'];
  const parts = Array.from({ length: 140 }, () => ({
    x: innerWidth / 2 + (Math.random() - 0.5) * 120, y: innerHeight * 0.35,
    vx: (Math.random() - 0.5) * 13, vy: -Math.random() * 13 - 4, r: Math.random() * 6 + 4,
    c: colors[Math.floor(Math.random() * colors.length)], a: Math.random() * 6, va: (Math.random() - 0.5) * 0.3,
  }));

  (function frame(t) {

      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore();

      return `<button type="button" class="crate ${counted ? 'counted' : ''}" data-c="crate" data-i="${i}" aria-label="Crate ${i + 1}${counted ? ', counted' : ''}">${counted ? '<span class="crate-check">✓</span>' : ''}${Array.from({ length: model.per }, () => tokenHTML(p.unit, tokenE)).join('')}</button>`;
    }).join('');
    return `<div class="model"><div class="model-head"><b>📦 Crate builder</b><span>Build the clue, then tap each crate as you count it.</span></div>
      <div class="steppers">
        <div class="stepper"><span>Crates</span><button type="button" class="step" data-c="crates" data-v="-1" aria-label="Fewer crates">−</button><b>${model.crates}</b><button type="button" class="step" data-c="crates" data-v="1" aria-label="More crates">+</button></div>
        <div class="stepper"><span>In each</span><button type="button" class="step" data-c="per" data-v="-1" aria-label="Fewer in each crate">−</button><b>${model.per}</b><button type="button" class="step" data-c="per" data-v="1" aria-label="More in each crate">+</button></div>
      </div>
      <div class="crate-row">${crates || '<span class="muted">Add some crates!</span>'}</div>
      ${p.unit > 1 ? `<div class="muted small-note">Each ${tokenHTML(p.unit)} is ${p.unit === 10 ? 'a pack of 10' : 'a bag of 100'}.</div>` : ''}
      ${model.msg ? `<div class="model-msg ${model.matched ? 'good' : ''}">${model.msg}</div>` : ''}</div>`;
  }

  function render() {
    if (!root.isConnected) return;
    if (st.solved) {
      root.innerHTML = `<div class="safe open"><div class="door" aria-hidden="true"></div>
        <div class="safe-inside"><div class="stamp cracked">CRACKED!</div>
        <div class="cracked-ans">${equationText(p)} = <b>${fmt(p.ans)}</b></div>
        <div class="stars-pop">+${st.stars} ⭐</div></div></div>`;
      return;
    }
    const opName = OP_NAME[p.op];
    root.innerHTML = `<div class="safe">
      <div class="safe-plate"><span class="safe-label">SAFE · ${opName.toUpperCase()} ${OP_SYMBOL[p.op]}</span><span class="safe-lock" aria-hidden="true">🔒</span></div>
      <div class="safe-face">${p.mode === 'column' ? columnHTML() : freeHTML()}</div>
      ${coachHTML()}${choicesHTML()}${keypadHTML()}
      <div class="safe-tools">${hintBtnHTML()}${!lab && S.tokens < 1 ? '<span class="muted tiny">No 🔎 tokens. Find bonus clues to earn more!</span>' : ''}</div>
      ${hintPanelHTML()}
    </div>${modelHTML()}`;
  }

  /* ---------- logic ---------- */
  function colVals(j) {
    const c = cols[j];
    return { t: c.topBlank ? 0 : c.top, b: c.botBlank ? 0 : c.bot };
  }
  function expectedDigit(j) {
    const c = cols[j], { t, b } = colVals(j);
    if (p.op === 'add') return (t + b + (c.gear ? 1 : 0)) % 10;
    // subtraction: the true digit of the answer at this place
    return digitAt(p.ans, c.place);
  }

  function tryColumn() {
    const c = cols[active];
    if (c.val == null) { coach('remind', `Tap a number for the <b>${PLACE_NAMES[c.place]}</b> wheel first.`); return render(); }
    const { t, b } = colVals(active);
    let r;
    if (p.op === 'add') r = checkAddColumn({ t, b, cin: c.gear ? 1 : 0, given: c.val, gearPlaced: active > 0 ? cols[active - 1].gear : false });
    else r = checkSubColumn({ T: t, B: b, received: c.received, given: c.val });
    if (r.status === 'ok') {
      c.done = true; undo = []; SFX.tumbler(); setTimeout(SFX.chime, 90);
      if (p.op === 'add' && r.carried) S.stats.carries++;
      if (p.op === 'sub' && r.borrowed) S.stats.borrows++;
      st.hint = null;
      active--;
      if (active < 0) return solve();
      coach('ok', `Click! The <b>${PLACE_NAMES[c.place]}</b> wheel is unlocked. Now the <b>${PLACE_NAMES[cols[active].place]}</b>.`);
    } else if (r.status === 'remind') {
      coach('remind', r.msg);
    } else {
      st.misses++; c.misses++; c.lastWrong = c.val; SFX.boop(); coach('miss', r.msg);
    }
    render();
  }

  function tryFree() {
    if (!st.entry) { coach('remind', 'Spin the wheels first: tap the numbers on the keypad.'); return render(); }
    const given = Number(st.entry);
    const r = p.op === 'mul' ? checkMul(p, given) : checkDiv(p, given);
    if (r.status === 'ok') return solve();
    st.misses++; st.freeMisses++; SFX.boop(); coach('miss', r.msg); render();
  }

  function solve() {
    st.solved = true; CURRENT_CIPHER = null;
    SFX.safeOpen();
    const res = { misses: st.misses, capped: st.capped, firstTry: st.misses === 0 && st.maxHint < 2 };
    st.stars = opts.onSolved ? opts.onSolved(res) : 0;
    render();
  }

  function lend(j) {
    if (j >= active) { coach('remind', 'Borrow from a column to the <b>left</b> of the one you\'re working on.'); return render(); }
    const c = cols[j], r = cols[j + 1];
    if (j + 1 !== active && !(r.top === 0 && !r.received)) { coach('remind', `Borrow from the column right next to the <b>${PLACE_NAMES[cols[active].place]}</b>.`); return render(); }
    if (c.lent) { coach('remind', 'That column already lent 1. Each column can only lend once.'); return render(); }
    if (r.received) { coach('remind', 'That column already borrowed once. Try the wheel now!'); return render(); }
    if (c.top === 0) { coach('remind', 'This column has 0, so it has nothing to lend yet. Borrow for it first: tap the number to <b>its</b> left!'); return render(); }
    c.top -= 1; c.lent = true; r.top += 10; r.received = true; undo.push(j);
    SFX.click(); st.coach = null; render();
  }
  function undoLend() {
    const j = undo.pop(); if (j == null) return;
    const c = cols[j], r = cols[j + 1];
    c.top += 1; c.lent = false; r.top -= 10; r.received = false;
    SFX.click(); coach('remind', 'Borrow undone.'); render();
  }

  function hint() {
    const isCol = p.mode === 'column';
    const lvl = isCol ? cols[active].hint : st.hintLevel;
    if (lvl >= 3) return;
    const next = lvl + 1;
    if (next >= 2 && !lab) {
      if (S.tokens < 1) { coach('remind', 'You\'re out of clue tokens 🔎. Find hidden bonus clues with your flashlight to earn more. Keep trying: after two tries, I\'ll give you choices!'); return render(); }
      S.tokens--; refreshHud(); SFX.coin();
    }
    if (isCol) cols[active].hint = next; else st.hintLevel = next;
    st.maxHint = Math.max(st.maxHint, next);
    if (next === 3) st.capped = true;
    st.hint = buildHint(next);
    save(); render();
  }

  function blocks(n, cls) { return Array.from({ length: n }, () => `<i class="blk ${cls}"></i>`).join(''); }
  function buildHint(level) {
    if (p.op === 'add') {
      const c = cols[active], { t, b } = colVals(active), cin = c.gear ? 1 : 0, s = t + b + cin, col = PLACE_NAMES[c.place];
      if (level === 1) { const tx = `Work on the ${col} column. Add the top number, the bottom number${cin ? ', and the carry gear' : ''}. If you get 10 or more, write only the ones digit and put a carry gear on the next column.`; return { title: 'Strategy', html: `<p>${tx}</p>`, say: tx }; }
      if (level === 2) { const tx = `Count all the blocks together. If there are 10 or more, ten of them ride up to the next column as a carry gear.`;
        return { title: 'Blocks', html: `<div class="blocks"><span class="bgrp">${blocks(t, 'a')}</span><b>+</b><span class="bgrp">${blocks(b, 'b')}</span>${cin ? `<b>+</b><span class="bgrp">${blocks(1, 'g')}</span>` : ''}</div><p>${tx}</p>`, say: tx }; }
      const tx = `${t} + ${b}${cin ? ' + 1' : ''} = ${s}. Write ${s % 10} on the wheel${s >= 10 ? ', and put a carry gear on the next column' : ''}.`;
      return { title: 'Show me how', html: `<p>${tx}</p>`, say: tx };
    }
    if (p.op === 'sub') {
      const c = cols[active], { t: T, b: B } = colVals(active), col = PLACE_NAMES[c.place];
      if (level === 1) { const tx = `Look at the ${col} column. Is the top number big enough to take the bottom number away? If not, tap the top number to its left to borrow 1 ten.`; return { title: 'Strategy', html: `<p>${tx}</p>`, say: tx }; }
      if (level === 2) {
        if (T < B) { const tx = `There are only ${T} blocks, but we need to take away ${B}. Not enough! Borrow 10 more from the column on the left.`; return { title: 'Blocks', html: `<div class="blocks"><span class="bgrp">${blocks(T, 'a')}</span></div><p>${tx}</p>`, say: tx }; }
        const tx = `Start with ${T} blocks and cross out ${B}. Count what's left.`;
        return { title: 'Blocks', html: `<div class="blocks"><span class="bgrp">${blocks(T - B, 'a')}${blocks(B, 'x')}</span></div><p>${tx}</p>`, say: tx };
      }
      let tx;
      if (T < B) {
        const left = cols[active - 1];
        tx = left && left.top === 0 ? `First borrow: the column to the left is 0, so tap the number left of it first, then tap the 0 column. Then ${T + 10} − ${B} = ${T + 10 - B}.` : `First tap the top number to the left to borrow. Then ${T + 10} − ${B} = ${T + 10 - B}.`;
      } else tx = `${T} − ${B} = ${T - B}. Put ${T - B} on the wheel.`;
      return { title: 'Show me how', html: `<p>${tx}</p>`, say: tx };
    }
    if (p.op === 'mul') {
      const { a, b, k, unit } = p;
      if (level === 1) { const tx = unit > 1 ? `Use a fact you know: ${a} × ${k}. Each crate holds ${unit === 10 ? 'tens' : 'hundreds'}, so put the zero${unit === 100 ? 's' : ''} back on the end.` : `Multiplying means equal groups. Build ${a} crates with ${b} in each, then count them all.`; return { title: 'Strategy', html: `<p>${tx}</p>`, say: tx }; }
      if (level === 2) { model.crates = a; model.per = k; model.counted.clear(); modelCheck(); const tx = `I built the crates for you. Count by ${fmt(b)}s: tap each crate as you go.`; return { title: 'Crates built', html: `<p>${tx}</p>`, say: tx }; }
      const tx = unit > 1 ? `${a} × ${k} = ${a * k}. They are ${unit === 10 ? 'tens' : 'hundreds'}, so ${a * k} ${unit === 10 ? 'tens' : 'hundreds'} is ${fmt(p.ans)}.` : `${a} × ${b} = ${p.ans}.`;
      return { title: 'Show me how', html: `<p>${tx}</p>`, say: tx };
    }
    const { N, d, qq, unit } = p;
    if (level === 1) { const tx = `Sharing means equal groups. Deal the pile into ${d} trays, one round at a time, until it's all gone. Then count one tray.`; return { title: 'Strategy', html: `<p>${tx}</p>`, say: tx }; }
    if (level === 2) {
      model.trays = Array(d).fill(0); model.pile = d * qq; model.fair = false;
      const rounds = Math.max(1, Math.floor(qq / 2));
      for (let r = 0; r < rounds; r++) { model.trays = model.trays.map(n => n + 1); model.pile -= d; }
      model.msg = ''; const tx = `I dealt some rounds for you. Keep dealing until the pile is empty!`;
      return { title: 'Trays started', html: `<p>${tx}</p>`, say: tx };
    }
    const tx = unit > 1 ? `Think: ${d} × ? = ${fmt(N)}. ${d} × ${qq} = ${d * qq}, so ${d} × ${fmt(qq * unit)} = ${fmt(N)}. The answer is ${fmt(p.ans)}.` : `Think: ${d} × ? = ${N}. ${d} × ${qq} = ${N}, so the answer is ${qq}.`;
    return { title: 'Show me how', html: `<p>${tx}</p>`, say: tx };
  }

  function modelCheck() {
    if (p.op === 'mul') {
      const ok = model.crates === p.a && model.per === p.k;
      if (ok && !model.matched) { model.matched = true; S.stats.arrays++; checkStatBadges(); SFX.chime(); }
      if (!ok) model.matched = false;
      model.msg = ok ? (model.counted.size === p.a ? '✓ Matches the clue, and every crate is counted!' : '✓ That matches the clue! Now tap each crate as you count.') : '';
    } else {
      if (model.pile === 0) {
        const fair = model.trays.every(n => n === model.trays[0]);
        if (fair && !model.fair) { model.fair = true; S.stats.deals++; checkStatBadges(); SFX.chime(); }
        model.msg = fair ? '✓ Fair share! Every tray has the same. Count one tray.' : 'Hmm, not fair. Some trays have more than others. Tap Start over.';
      } else model.msg = '';
    }
  }

  function onClick(e) {
    const b = e.target.closest('[data-c]'); if (!b || !root.contains(b) || b.disabled || st.solved) return;
    handle(b.dataset.c, b.dataset.v != null ? Number(b.dataset.v) : null, b);
  }
  function handle(c, v, b) {
    if (c === 'd') {
      SFX.click();
      if (p.mode === 'column') { cols[active].val = v; }
      else { if (!(st.entry === '' && v === 0) && st.entry.length < W) st.entry += String(v); }
      return render();
    }
    if (c === 'back') { st.entry = st.entry.slice(0, -1); SFX.click(); return render(); }
    if (c === 'pick') { SFX.click(); if (p.mode === 'column') cols[active].val = v; else st.entry = String(v); return render(); }
    if (c === 'try') return p.mode === 'column' ? tryColumn() : tryFree();
    if (c === 'gear') { const g = cols[active - 1]; if (g) { g.gear = !g.gear; SFX.tumbler(); } return render(); }
    if (c === 'lend') return lend(Number(b.dataset.j));
    if (c === 'undo') return undoLend();
    if (c === 'hint') return hint();
    if (c === 'tray') { if (model.pile > 0) { model.pile--; model.trays[Number(b.dataset.i)]++; SFX.click(); modelCheck(); } return render(); }
    if (c === 'deal') { if (model.pile >= p.d) { model.trays = model.trays.map(n => n + 1); model.pile -= p.d; SFX.tumbler(); modelCheck(); } return render(); }
    if (c === 'resetTrays') { model.trays = Array(p.d).fill(0); model.pile = p.d * p.qq; model.fair = false; model.msg = ''; SFX.click(); return render(); }
    if (c === 'crates') { model.crates = Math.max(0, Math.min(9, model.crates + v)); model.counted.clear(); SFX.click(); modelCheck(); return render(); }
    if (c === 'per') { model.per = Math.max(0, Math.min(9, model.per + v)); model.counted.clear(); SFX.click(); modelCheck(); return render(); }
    if (c === 'crate') { const i = Number(b.dataset.i); model.counted.has(i) ? model.counted.delete(i) : model.counted.add(i); SFX.click(); modelCheck(); return render(); }
  }
  root.addEventListener('click', onClick);

  const api = {
    key(k) {
      if (st.solved) return false;
      if (/^[0-9]$/.test(k)) { handle('d', Number(k), null); return true; }
      if (k === 'Enter') { p.mode === 'column' ? tryColumn() : tryFree(); return true; }
      if (k === 'Backspace') { if (p.mode === 'column') { cols[active].val = null; render(); } else { st.entry = st.entry.slice(0, -1); render(); } return true; }
      return false;
    },
    get solved() { return st.solved; },
  };
  CURRENT_CIPHER = api;
  render();
  return api;
}

document.addEventListener('keydown', (e) => {
  if (!CURRENT_CIPHER || e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  if (!$('#modal-root').hidden) return;
  if (document.activeElement && document.activeElement.id === 'scanner') return;
  if (e.key === 'Enter' && document.activeElement && document.activeElement.tagName === 'BUTTON') return;
  if (CURRENT_CIPHER.key(e.key)) e.preventDefault();
});

/* ============================================================
   Flashlight scanner: a dark scene, a lens that follows the pointer,
   one required evidence spot and bonus spots.
   ============================================================ */
function createScanner(canvas, cfg) {
  // cfg: { theme, evidence, bonus:[e,e], seed, lensId, found:{evidence, bonus:[b,b]}, onFind(kind, idx), onDecoy(e), onHint(text) }
  const theme = THEMES[cfg.theme] || THEMES.museum;
  const rng = makeRng('scan', cfg.seed);
  const lens = SHOP.lenses.find(l => l.id === cfg.lensId) || SHOP.lenses[0];
  const ctx = canvas.getContext('2d');
  const scene = document.createElement('canvas'), sctx = scene.getContext('2d');
  const dark = document.createElement('canvas'), dctx = dark.getContext('2d');
  let W = 0, H = 0, dpr = 1;
  const pos = { x: 0.5, y: 0.5 }; // normalized lens position
  const t0 = performance.now();
  let lastFindT = t0, hintShown = false, alive = true;

  // place spots
  const spots = [];
  function place(e, kind, size, idx = 0) {
    for (let tries = 0; tries < 300; tries++) {
      const x = 0.08 + rng() * 0.84, y = 0.14 + rng() * 0.74;
      if (spots.every(s => Math.hypot((s.x - x) * 1.6, s.y - y) > 0.2)) { spots.push({ e, kind, size, x, y, idx }); return; }
    }
    spots.push({ e, kind, size, x: 0.1 + rng() * 0.8, y: 0.2 + rng() * 0.6, idx });
  }
  place(cfg.evidence.e, 'evidence', 0.07);
  (cfg.bonus || ['🔎', '🔎']).forEach((e, i) => place(e, 'bonus', 0.055, i));
  shuffle(rng, theme.props).forEach(e => place(e, 'decoy', 0.085));
  // decorations (not interactive)
  const decor = Array.from({ length: 28 }, () => ({ x: rng(), y: rng() * 0.7, r: rng() * 1.6 + 0.4 }));

  function isFound(s) { return s.kind === 'evidence' ? cfg.found.evidence : s.kind === 'bonus' ? cfg.found.bonus[s.idx] : false; }

  function resize() {
    const r = canvas.getBoundingClientRect();
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = Math.max(200, r.width); H = Math.round(W * 0.6);
    canvas.style.height = H + 'px';
    for (const c of [canvas, scene, dark]) { c.width = Math.round(W * dpr); c.height = Math.round(H * dpr); }
    drawScene();
  }

  function drawScene() {
    const g = sctx; g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const grad = g.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, theme.sky[0]); grad.addColorStop(1, theme.sky[1]);
    g.fillStyle = grad; g.fillRect(0, 0, W, H);
    g.fillStyle = 'rgba(255,255,255,0.35)';
    for (const d of decor) { g.beginPath(); g.arc(d.x * W, d.y * H, d.r, 0, Math.PI * 2); g.fill(); }
    g.fillStyle = theme.floor; g.fillRect(0, H * 0.78, W, H * 0.22);
    g.fillStyle = 'rgba(0,0,0,0.18)'; for (let x = 0; x < W; x += 46) g.fillRect(x, H * 0.78, 2, H * 0.22);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    for (const s of spots) {
      if (isFound(s)) continue;
      const fs = Math.max(20, Math.min(54, s.size * W));
      g.font = `${fs}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
      g.globalAlpha = s.kind === 'decoy' ? 1 : 0.92;
      g.fillText(s.e, s.x * W, s.y * H);
    }
    g.globalAlpha = 1;
  }

  function lensR() { return Math.max(44, Math.min(84, W * 0.13)); }

  function frame(now) {
    if (!alive) return;
    if (!canvas.isConnected) { alive = false; return; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(scene, 0, 0, W, H);
    // darkness with a soft lens cut-out
    const R = lensR(), lx = pos.x * W, ly = pos.y * H;
    dctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    dctx.globalCompositeOperation = 'source-over';
    dctx.clearRect(0, 0, W, H);
    dctx.fillStyle = 'rgba(3,7,16,0.94)'; dctx.fillRect(0, 0, W, H);
    dctx.globalCompositeOperation = 'destination-out';
    const rg = dctx.createRadialGradient(lx, ly, R * 0.55, lx, ly, R);
    rg.addColorStop(0, 'rgba(0,0,0,1)'); rg.addColorStop(1, 'rgba(0,0,0,0)');
    dctx.fillStyle = rg; dctx.beginPath(); dctx.arc(lx, ly, R, 0, Math.PI * 2); dctx.fill();
    dctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(dark, 0, 0, W, H);
    // gentle pulse at the evidence after a while
    const elapsed = now - lastFindT;
    if (!cfg.found.evidence && elapsed > 18000) {
      const ev = spots.find(s => s.kind === 'evidence');
      const a = REDUCED() ? 0.45 : 0.25 + 0.25 * Math.sin(now / 300);
      ctx.strokeStyle = `rgba(233,207,148,${a})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(ev.x * W, ev.y * H, 26 + (REDUCED() ? 0 : 6 * Math.sin(now / 300)), 0, Math.PI * 2); ctx.stroke();
      if (!hintShown) { hintShown = true; cfg.onHint && cfg.onHint(directionHint(ev)); }
    }
    // lens rim + handle
    let stroke;
    if (lens.rim === 'rainbow') {
      if (ctx.createConicGradient) { stroke = ctx.createConicGradient(now / 1500, lx, ly); ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#c77dff', '#ff6b6b'].forEach((c, i) => stroke.addColorStop(i / 5, c)); }
      else stroke = '#ffd93d';
    } else { stroke = ctx.createLinearGradient(lx - R, ly - R, lx + R, ly + R); stroke.addColorStop(0, lens.rim[0]); stroke.addColorStop(1, lens.rim[1]); }
    ctx.lineCap = 'round';
    ctx.strokeStyle = stroke; ctx.lineWidth = 12;
    const hx = lx + R * 0.72, hy = ly + R * 0.72;
    ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx + R * 0.55, hy + R * 0.55); ctx.stroke();
    ctx.lineWidth = 7; ctx.beginPath(); ctx.arc(lx, ly, R - 2, 0, Math.PI * 2); ctx.stroke();
    if (lens.sparkle) {
      ctx.fillStyle = '#fff';
      for (let i = 0; i < 5; i++) {
        const ang = (REDUCED() ? 0 : now / 900) + i * 1.257, rr = R + 6;
        const sz = 1.5 + (REDUCED() ? 1 : Math.abs(Math.sin(now / 250 + i)) * 2);
        ctx.beginPath(); ctx.arc(lx + Math.cos(ang) * rr, ly + Math.sin(ang) * rr, sz, 0, Math.PI * 2); ctx.fill();
      }
    }
    requestAnimationFrame(frame);
  }

  function directionHint(s) {
    const v = s.y < 0.4 ? 'top' : s.y > 0.65 ? 'bottom' : 'middle';
    const h = s.x < 0.38 ? 'left' : s.x > 0.62 ? 'right' : '';
    const where = v === 'middle' ? (h ? `on the ${h} side` : 'right in the middle') : (h ? `near the ${v}-${h}` : `near the ${v}`);
    return `Psst! Try looking ${where}. I see something glinting there!`;
  }

  function setPos(clientX, clientY) {
    const r = canvas.getBoundingClientRect();
    pos.x = Math.max(0, Math.min(1, (clientX - r.left) / r.width));
    pos.y = Math.max(0, Math.min(1, (clientY - r.top) / r.height));
  }
  function tryCollect() {
    const px = pos.x * W, py = pos.y * H;
    let best = null, bd = Infinity;
    for (const s of spots) {
      if (isFound(s)) continue;
      const d = Math.hypot(s.x * W - px, s.y * H - py);
      if (d < bd) { bd = d; best = s; }
    }
    if (!best || bd > 38) return;
    if (best.kind === 'decoy') { cfg.onDecoy && cfg.onDecoy(best.e); return; }
    if (best.kind === 'evidence') cfg.found.evidence = true; else cfg.found.bonus[best.idx] = true;
    lastFindT = performance.now();
    drawScene();
    cfg.onFind && cfg.onFind(best.kind, best.idx, best.e);
  }

  canvas.addEventListener('pointermove', (e) => { setPos(e.clientX, e.clientY); });
  canvas.addEventListener('pointerdown', (e) => { setPos(e.clientX, e.clientY); tryCollect(); });
  canvas.addEventListener('keydown', (e) => {
    const step = 0.05;
    if (e.key === 'ArrowLeft') pos.x = Math.max(0, pos.x - step);
    else if (e.key === 'ArrowRight') pos.x = Math.min(1, pos.x + step);
    else if (e.key === 'ArrowUp') pos.y = Math.max(0, pos.y - step * 1.6);
    else if (e.key === 'ArrowDown') pos.y = Math.min(1, pos.y + step * 1.6);
    else if (e.key === 'Enter' || e.key === ' ') tryCollect();
    else return;
    e.preventDefault();
  });
  const ro = new ResizeObserver(() => { if (!canvas.isConnected) { ro.disconnect(); return; } if (Math.abs(canvas.getBoundingClientRect().width - W) > 1) resize(); });
  ro.observe(canvas);
  resize();
  requestAnimationFrame(frame);
  return { stop() { alive = false; ro.disconnect(); } };
}

  run.ruledOut.push(...newly);
  if (newly.length) {
    newly.forEach((id, k) => setTimeout(() => toast(`${SUSPECTS[id].e} <b>${esc(SUSPECTS[id].short)}:</b> “${esc(SUSPECTS[id].cleared)}”`, 3400), k * 400));
    speak(SUSPECTS[newly[0]].cleared, SUSPECTS[newly[0]].voice);
  } else toast('🦊 Everyone left still matches. This clue keeps them all on the list. On to the next one!', 3600);
  ui.checkMarks = new Set();
  if (s < 3) { run.scene++; run.stage = 'story'; } else run.stage = 'arrest';
  save(); rerenderCase();
}

function mountLab() {

}

  arrest: (a, el) => doArrest(a, el),
  confess: (a) => confess(a),
  closeCase: () => closeCaseFlow(),
  interview: (a) => interview(a),
  labOp: (a) => { S.lab.op = a; save(); newLabProblem(); render(); },
  labLevel: (a) => { S.lab.level = Number(a); save(); newLabProblem(); render(); },
  labNext: () => { newLabProblem(); render(); window.scrollTo({ top: 0, behavior: REDUCED() ? 'auto' : 'smooth' }); },
  shopTab: (a) => { ui.shopTab = a; render(); },
  buy: (a) => buy(a),
  equip: (a) => equip(a),
  gearTap: () => { if (ui.holdDone) { ui.holdDone = false; return; } toast('Grown-ups: press and hold ⚙️ for 2 seconds.'); },
  testVoice: () => speak('Hello, Detective! I am Inspector Felix. Let\'s crack this case together.'),
  resetAsk: () => { $('#resetConfirm').hidden = false; },
  resetCancel: () => { $('#resetConfirm').hidden = true; },
  resetDo: () => {
    try { localStorage.removeItem(STORE_KEY); } catch (e) {}
    S = defaultState(); ui.lab = null; closeModal(); render(); toast('All progress erased. A fresh start!');
  },
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled || el.getAttribute('aria-disabled') === 'true' && el.dataset.action !== 'openCase') return;
  const fn = ACTIONS[el.dataset.action]; if (!fn) return;
  audio(); // unlock WebAudio on first gesture
  fn(el.dataset.arg, el, e);
});
document.addEventListener('click', (e) => { if (e.target.classList && e.target.classList.contains('modal-backdrop') && $('#modal-root').dataset.closable) closeModal(); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !$('#modal-root').hidden && $('#modal-root').dataset.closable) closeModal();
  if (e.key === 'Enter' && e.target && e.target.id === 'nameInput') ACTIONS.finishSetup();
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.name === 'pLevel') { setLevel(t.value); toast('Math level updated.'); }
  else if (t.id === 'pAuto') { S.settings.autoRead = t.checked; save(); }
  else if (t.id === 'pSound') { S.settings.sound = t.checked; save(); if (t.checked) SFX.chime(); }
  else if (t.id === 'pUnlock') { S.settings.unlockAll = t.checked; save(); }
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.id === 'pName') { S.profile.name = t.value.trim().slice(0, 16) || 'Rookie'; save(); }
  else if (t.id === 'pRate') { S.settings.voiceRate = Number(t.value); const v = $('#pRateVal'); if (v) v.textContent = Number(t.value).toFixed(2) + '×'; save(); }
});

/* parent gear: press and hold for 2 seconds */
function startHold(g) {
  cancelHold(); ui.holdDone = false; g.classList.add('holding');
  ui.holdTimer = setTimeout(() => { ui.holdTimer = null; ui.holdDone = true; g.classList.remove('holding'); openParent(); }, 2000);
}
function cancelHold() {
  if (ui.holdTimer) { clearTimeout(ui.holdTimer); ui.holdTimer = null; }
  const g = $('#parentGear'); if (g) g.classList.remove('holding');
}
document.addEventListener('pointerdown', (e) => { const g = e.target.closest && e.target.closest('#parentGear'); if (g) { e.preventDefault(); startHold(g); } });
document.addEventListener('pointerup', () => { if (ui.holdTimer) cancelHold(); });
document.addEventListener('pointercancel', () => cancelHold());
document.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.id === 'parentGear' && !e.repeat) { e.preventDefault(); startHold(e.target); } });
document.addEventListener('keyup', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.id === 'parentGear') { cancelHold(); } });
document.addEventListener('contextmenu', (e) => { if (e.target.closest && e.target.closest('#parentGear')) e.preventDefault(); });

/* boot */
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
render();

</script>
<script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
</body>
